<title>Egg Heist 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2a3a;color:#fff;font-family:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
button,input{font:inherit;border:0;border-radius:16px;padding:12px 20px}
button{background:#ffb703;color:#5a3300;font-weight:800;box-shadow:0 4px 0 #c97d00;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c97d00}
button.alt{background:#fff;box-shadow:0 4px 0 #cfcfcf;color:#6b4a22}
/* menu */
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;background:linear-gradient(#8fd3f4 0%,#d4f1ff 58%,#8fdc74 58.1%,#6bbf59 100%)}
.hill{position:absolute;bottom:-60px;left:-15%;width:75%;height:260px;border-radius:50%;background:#7bd462}
.hill.b{left:auto;right:-20%;width:85%;height:220px;background:#59b246}
.cloud{position:absolute;width:120px;height:38px;background:#fff;border-radius:40px;opacity:.92;animation:drift 45s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:52px;height:52px;top:-26px;left:18px}
.cloud:after{width:38px;height:38px;top:-17px;left:64px}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(130vw)}}
.fe{position:absolute;width:28px;height:36px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:bob 3s ease-in-out infinite;box-shadow:inset -5px -5px 0 rgba(0,0,0,.1)}
@keyframes bob{50%{transform:translateY(-16px) rotate(8deg)}}
.card{position:relative;z-index:2;background:rgba(255,255,255,.9);border-radius:30px;padding:18px 22px 24px;max-width:380px;max-height:94vh;overflow-y:auto;width:100%;text-align:center;color:#6b4a22;box-shadow:0 8px 0 rgba(0,0,0,.12),0 20px 40px rgba(0,0,0,.18)}
.card h1{margin:2px 0 4px;font-size:clamp(38px,11vw,54px);line-height:1;color:#ff8f3c;text-shadow:0 3px 0 #b5651d,0 7px 0 rgba(0,0,0,.12)}
.card p{margin:4px 0 8px;font-size:15px}
.card input{width:100%;text-align:center;background:#fff7e0;border:3px solid #ffd166;color:#5a3b1c;font-weight:800}
.col{display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-top:8px}
.col input.code{letter-spacing:6px;text-transform:uppercase}
#err{color:#d93a3a;min-height:18px;font-size:14px}
.logo{animation:wob 2.6s ease-in-out infinite;display:block;margin:0 auto}
@keyframes wob{50%{transform:rotate(4deg) translateY(-4px)}}
/* game ui */
#hud{position:fixed;top:8px;left:8px;z-index:3;font-weight:700;font-size:12px;pointer-events:none}
.hr{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.42);border-radius:10px;padding:3px 9px;margin-bottom:3px;white-space:nowrap;text-shadow:0 1px 3px #000}
.hr.me{outline:2px solid rgba(255,255,255,.5)}
.hn{max-width:72px;overflow:hidden;text-overflow:ellipsis}
.mo{color:#5dff7a;font-weight:900;text-shadow:0 0 6px rgba(93,255,122,.55)}
.spd{color:#58b6ff;font-weight:900;text-shadow:0 0 6px rgba(88,182,255,.55)}
.inc{color:#9dffb0;font-size:11px}
@media(max-width:430px){.inc{display:none}}
.ic{flex:none;display:inline-block}
.ic.lock{filter:brightness(0) opacity(.45)}
#clock{position:fixed;top:50px;right:8px;z-index:3;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000;pointer-events:none;text-align:right}
#room{display:none;position:fixed;top:52px;right:8px;z-index:3;font-size:11px;opacity:.8;background:rgba(0,0,0,.35);padding:4px 8px;border-radius:8px;cursor:pointer}
#top{position:fixed;top:76px;left:8px;z-index:4;display:none;gap:6px}
#top button{font-size:13px;padding:8px 12px}
#panel{position:fixed;top:122px;left:8px;right:8px;max-width:400px;max-height:42vh;overflow-y:auto;z-index:6;display:none;background:rgba(40,28,15,.93);border-radius:14px;padding:6px 12px;font-size:14px}
#panel .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)}
#panel .it:last-child{border:0}
#panel .nm{flex:1;min-width:0}
#panel small{opacity:.8;margin-left:6px}
#panel .it span{font-weight:800}
#panel button{padding:6px 12px;font-size:13px}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden;margin-top:4px}
.bar div{height:100%;background:#7bd462}
.dot{width:16px;height:21px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:inline-block;flex:none}
.dot.p{border-radius:50%;height:18px}
#pick{position:fixed;top:40%;right:10px;z-index:5;display:none;font-size:14px;padding:12px 16px}
#jump{position:fixed;bottom:76px;right:14px;z-index:5;display:none;width:64px;height:64px;border-radius:50%;padding:0;font-size:13px}
#hot{position:fixed;bottom:8px;left:0;right:0;z-index:4;display:none;justify-content:center;gap:4px}
.slot{position:relative;width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,.5);border:2px solid #556;display:flex;align-items:center;justify-content:center}
.slot.on{border-color:#ffd166;cursor:pointer}
.slot.g{border-color:#ffb703;box-shadow:0 0 8px #ffb703}
.slot b{position:absolute;bottom:-2px;font-size:9px;font-weight:800;text-shadow:0 1px 2px #000}
.slot i{display:block;background:var(--c)}
.slot i.egg{width:18px;height:23px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.slot i.pet{width:22px;height:18px;border-radius:50%;position:relative}
.slot i.pet:before,.slot i.pet:after{content:"";position:absolute;top:-6px;width:8px;height:9px;background:var(--c);border-radius:50% 50% 0 0}
.slot i.pet:before{left:1px}.slot i.pet:after{right:1px}
.slot i.bat,.tile i.bat{display:block;width:8px;height:30px;border-radius:4px;background:linear-gradient(#d9b070,#7a5230);transform:rotate(35deg)}
#pbar{position:fixed;bottom:58px;left:0;right:0;text-align:center;z-index:4;display:none;font-weight:800;text-shadow:0 2px 5px #000;padding:0 10px;pointer-events:none}
.rc{font-size:11px;opacity:.85;font-weight:700}
.menuface{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 6px}
.menuface .avc{width:116px;height:116px;border-width:5px}
.menuface b{font-size:22px;color:#5a3b1c;cursor:pointer;border-bottom:2px dashed rgba(90,59,28,.35)}
.hubhead{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff7e0,#ffe3a3);border-radius:20px;padding:10px 12px;border:3px solid #ffd166;text-align:left}
.avc{width:68px;height:68px;border-radius:50%;overflow:hidden;border:4px solid #ff8f3c;background:radial-gradient(#fff7c8,#ffd166);box-shadow:0 4px 0 rgba(0,0,0,.15);flex:none}
.avc img{width:100%;height:100%;object-fit:cover;display:block}
.hub-n{flex:1;min-width:0}
.hub-n b{display:block;font-size:20px;color:#5a3b1c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hub-n small{font-weight:800;font-size:13px;color:#6b4a22}
.gear{width:44px;height:44px;padding:0;font-size:22px;border-radius:14px;flex:none}
.sq2{padding:8px 12px;font-size:13px;border-radius:12px;box-shadow:0 3px 0 #c97d00}
.sq2.x{background:#ffd9d9;box-shadow:0 3px 0 #d99a9a;color:#a33}
.fr{display:flex;align-items:center;gap:8px;background:#fff7e0;border-radius:14px;padding:6px 8px;text-align:left}
.avs{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid #ffd166;flex:none;background:#ffe9a8}
.avs img{width:100%;height:100%;object-fit:cover;display:block}
.fn{flex:1;min-width:0;font-weight:800;font-size:14px;color:#5a3b1c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn small{display:block;font-size:11px;font-weight:700}
.fn small.on{color:#2e9d4a}
.fn small.off{color:#999}
.dim{margin:0;font-size:13px;opacity:.7}
.fbox{background:rgba(255,255,255,.55);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.fbox .top{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}
.srvh{display:flex;align-items:center;justify-content:space-between;text-align:left}
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px}
.card textarea{width:100%;height:96px;border-radius:12px;border:3px solid #ffd166;padding:8px;font:12px monospace;color:#5a3b1c;background:#fff7e0;text-transform:none;resize:none}
#name,.card input[type=password]{text-transform:none}
#top button[data-tab="b"]{background:#a9744a;box-shadow:0 4px 0 #7a4f2e;color:#fff}
#top button[data-tab="e"]{background:#ffc58a;box-shadow:0 4px 0 #d9964f;color:#6a3a00}
#top button[data-tab="i"]{background:#7cc4ff;box-shadow:0 4px 0 #3f8fd1;color:#0b2a4a}
.acc{display:flex;align-items:center;gap:6px;background:#fff7e0;border:3px solid #ffd166;border-radius:16px;padding:6px 8px}
.acc .ap{flex:1;text-align:left;background:transparent;box-shadow:none;color:#5a3b1c;padding:6px 8px;font-size:15px;min-width:0}
.acc .ap small{display:block;font-weight:700;opacity:.75;font-size:12px}
.acc button.sq{width:40px;height:40px;padding:0;font-size:18px;border-radius:12px;flex:none}
.acc button.sq.off{opacity:.4}
.acc button.dots3{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#ffd166}
.acc button.dots3 i{width:5px;height:5px;border-radius:50%;background:#5a3300;display:block}
.tile em{position:absolute;top:1px;left:0;right:0;font-size:8px;font-style:normal;text-align:center;line-height:1;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px 0}
.tile{position:relative;aspect-ratio:1;background:rgba(255,255,255,.07);border:2px solid #556;border-radius:10px;display:flex;align-items:center;justify-content:center}
.tile.on{border-color:#ffd166;cursor:pointer}
.tile.g{border-color:#ffb703;box-shadow:0 0 8px #ffb703}
.tile.sel{outline:2px solid #fff;box-shadow:0 0 10px #fff}
.tile b{position:absolute;bottom:0;font-size:9px;font-weight:800;text-shadow:0 1px 2px #000}
#camb{position:fixed;top:6px;right:50px;z-index:9;display:none;width:38px;height:38px;padding:0;align-items:center;justify-content:center;border-radius:12px;font-size:18px}
#camb.on{background:#7bd462;box-shadow:0 4px 0 #3f8f2e}
#giftb{position:fixed;top:72%;right:10px;z-index:5;display:none;font-size:14px;padding:12px 16px;background:#ff7eb6;box-shadow:0 4px 0 #c24882;color:#fff}
#gift{position:fixed;top:104px;left:50%;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:rgba(40,28,15,.96);border:3px solid #ff7eb6;border-radius:16px;padding:10px 14px;max-width:92vw;font-weight:700}
#gift button{padding:8px 14px;font-size:14px}
#gpick{position:fixed;inset:0;z-index:13;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.5)}
#shopb{position:fixed;top:62%;right:10px;z-index:5;display:none;font-size:14px;padding:12px 16px}
#notice{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:8;display:none;background:linear-gradient(#ffe58a,#ffb703);color:#5a3300;font-weight:900;padding:10px 18px;border-radius:999px;box-shadow:0 4px 0 #c97d00;text-align:center;max-width:92vw;pointer-events:none}
#dots{position:fixed;top:6px;right:6px;z-index:9;display:none;width:38px;height:38px;padding:0;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px}
#dots i{width:6px;height:6px;border-radius:50%;background:#5a3300}
#pause{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
.slot.sel{border-color:#fff;box-shadow:0 0 10px #fff}
#cd{position:fixed;top:56px;left:0;right:0;text-align:center;font-size:20px;font-weight:900;color:#ff6a5a;text-shadow:0 2px 6px #000;z-index:4;display:none;pointer-events:none}
#toast{position:fixed;top:32%;left:0;right:0;z-index:7;text-align:center;font-weight:800;font-size:18px;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .3s;padding:0 12px}
#stick,#knob{position:fixed;border-radius:50%;display:none;pointer-events:none;z-index:3}
#stick{width:110px;height:110px;margin:-55px 0 0 -55px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4)}
#knob{width:46px;height:46px;margin:-23px 0 0 -23px;background:rgba(255,255,255,.7)}
</style>
</head>

      <ellipse cx="22" cy="82" rx="7" ry="4.5" fill="#ffa8a8"/><ellipse cx="70" cy="82" rx="7" ry="4.5" fill="#ffa8a8"/>
      <path d="M38 84 Q46 93 54 84" fill="none" stroke="#4a2e12" stroke-width="3.5" stroke-linecap="round"/>

    <h1>Egg Heist</h1>
    <div id="s2" class="col">
      <div class="menuface"><div class="avc"><img id="avimg" alt=""></div><b id="hubname" title="Tap to change your name"></b></div>
      <button id="solo">Play solo</button>
      <button id="multi">Play with friends</button>
      <button id="tohub" class="alt">Back to GameExpVault</button>
    </div>
    <div id="mp" class="col" style="display:none">
      <div class="row2"><button id="createpub">Public room</button><button id="createpriv" class="alt">Private room</button></div>
      <div class="row2"><input id="code" class="code" maxlength="4" placeholder="CODE" autocomplete="off"><button id="join">Join</button></div>
      <div class="srvh"><b>Live servers</b><button id="refresh" class="sq2">Refresh</button></div>
      <div id="srv" class="col" style="margin:0;gap:6px"></div>
      <button id="back" class="alt">Back</button>
    </div>
    <div id="err"></div>
  </div>
</div>

      const dx=o.x-p.x,dz=o.z-p.z,l=Math.hypot(dx,dz)||1;
      if(o.carry){
        eggs.push({i:nextEgg++,y:o.carry.y,kg:o.carry.kg,g:o.carry.g,x:o.x,z:o.z,bi:o.carry.bi,n:o.carry.n,d:1,dt:now});
        o.carry=null;ev(p.n+" smacked "+o.n+" and the egg dropped!");
      }
      knock(oid,dx/l*18,dz/l*18);
    }
    return;
  }
  if(a==="st"){
    if(p.carry){tell(id,"Your hands are full. Run home first!");return;}
    let g=null,bd=3.4;
    for(const e of eggs){const d=dist(e,p);if(d<bd){bd=d;g=e;}}
    if(!g)return;
    p.carry={y:g.y,kg:g.kg,g:g.g,bi:g.bi,n:g.n};p.eq=-2;
    eggs=eggs.filter(q=>q!==g);
    if(!g.d)nestT[g.bi][g.n]=now+12000;
    tell(id,"Egg stolen! Run home before the "+MONS[g.bi].n+" catches you!");
    return;
  }
  if(a==="pl"){
    const it=p.inv[i];if(!it)return;
    const pl=PLOTS[p.b],ox=+x-pl.x,oz=+z-pl.z;
    if(!(Math.hypot(ox,oz)<R-1)){tell(id,"Tap inside your plot.");return;}
    if(it[0]==="p"&&p.pl.filter(o=>o.k==="p").length>=p.ps){tell(id,"Pet slots full! Unequip a pet or buy a slot.");return;}
    if(it[0]==="e"&&p.pl.filter(o=>o.k==="e").length>=6){tell(id,"Too many eggs on your plot.");return;}
    if(p.pl.some(o=>Math.hypot(o.x-ox,o.z-oz)<1.8)){tell(id,"Too close to another item.");return;}
    p.pl.push({id:nextItem++,k:it[0],y:it[1],kg:it[2],g:it[3],t:it[0]==="e"?now+TYPES[it[1]].h*1000:0,x:ox,z:oz});
    p.inv.splice(i,1);p.eq=-2;
  }else if(a==="pk"){
    const it=p.pl[i];
    if(it&&it.k==="p"){
      if(p.inv.length>=CAP){tell(id,"Inventory full.");return;}
      p.inv.push(["p",it.y,it.kg,it.g]);p.pl.splice(i,1);
    }
  }else if(a==="hh"){
    const it=p.pl[i];
    if(it&&it.k==="e"&&now>=it.t){
      const pl=PLOTS[p.b],wx=pl.x+it.x,wz=pl.z+it.z;
      p.pl.splice(i,1);
      p.pend.push({y:it.y,kg:it.kg,g:it.g,t:now+1800+Math.min(4500,Math.hypot(p.x-wx,p.z-wz)/3.2*1000)});
      fx({t:"ha",o:id,x:wx,z:wz,y:it.y,kg:it.kg,g:it.g});
      ev(p.n+" hatched a "+kgs(it.kg)+" "+PET_NAMES[it.y]+"!");
    }
  }
}
function tick(){
  const now=Date.now(),dt=.05;
  const me=players.h;
  if(me&&me.tp===myTp){me.x=mx;me.z=mz;me.y=jy;}
  phaseT-=dt;
  if(phaseT<=0){if(phaseNight)endNight();else startNight();}
  for(const gid in gifts){
    const gf=gifts[gid];
    if(now>gf.t){const snd=players[gf.from];if(snd){snd.inv.push(gf.item);tell(gf.from,"Your gift expired.");}sendGift(gf.to,{t:"gx",gid:+gid});delete gifts[gid];}
  }
  eggs=eggs.filter(e=>!(e.d&&now-e.dt>60000));
  /* monsters sleep on their nests; a thief wakes one (0.5s delay) and it chases until the egg is safe */
  for(const m of mons){
    const d=MONS[m.k];let tg=null,bd=1e9;
    for(const id in players){
      const p=players[id];
      if(p.x<BX||now<p.imm||!p.carry||p.carry.bi!==m.k)continue;
      const dd=dist(p,m);if(dd<bd){bd=dd;tg=p;}
    }
    if(tg){
      if(m.st===0){m.st=1;m.wt=now+500;}
      else if(m.st===1){if(now>=m.wt)m.st=2;}
      else m.st=2;
    }else if(m.st===1)m.st=0;
    else if(m.st===2)m.st=3;
    if(m.st===2&&tg){
      const dx=tg.x-m.x,dz=tg.z-m.z,l=Math.hypot(dx,dz);
      if(l>.2){m.x=clamp(m.x+dx/l*d.s*dt,BX+1,XEND-1);m.z=clamp(m.z+dz/l*d.s*dt,-12.5,12.5);}
      if(dist(tg,m)<1.9){
        const lost=tg.carry;tg.carry=null;returnEgg(lost);tg.imm=now+2500;
        const kx=tg.x-m.x,kz=tg.z-m.z,kl=Math.hypot(kx,kz)||1;
        knock(Object.keys(players).find(k=>players[k]===tg),kx/kl*16,kz/kl*16);
        ev("The "+d.n+" caught "+tg.n+" and took its egg back!");
      }
    }else if(m.st===3){
      const dx=m.hx-m.x,dz=m.hz-m.z,l=Math.hypot(dx,dz);
      if(l<1){m.x=m.hx;m.z=m.hz;m.st=0;}
      else{m.x+=dx/l*10*dt;m.z+=dz/l*10*dt;}
    }
  }
  for(const id in players){
    const p=players[id];
    if(p.x<BX&&p.carry){
      if(p.inv.length<CAP){const dk=p.carry.bi+"-"+p.carry.y;p.dx[dk]=Math.max(p.dx[dk]||0,p.carry.kg);p.inv.push(["e",p.carry.y,p.carry.kg,p.carry.g]);p.carry=null;tell(id,"Safe! The egg is in your inventory.");}
      else if(now>p.mt){tell(id,"Inventory full! Place an item on your plot first.");p.mt=now+2500;}
    }
    for(let k=p.pend.length-1;k>=0;k--){
      const q=p.pend[k];
      if(now>=q.t){
        if(p.inv.length<CAP){p.inv.push(["p",q.y,q.kg,q.g]);p.pend.splice(k,1);}
        else if(now>p.mt){tell(id,"Inventory full! Your pet is waiting.");p.mt=now+2500;}
      }
    }
    if(onBelt(p))p.sp+=gainOf(p.tl)*trailMult(p.tr)*dt;
    for(const it of p.pl)if(it.k==="p")p.s+=TYPES[it.y].inc*it.kg*dt;
  }
}
function broadcast(){
  const now=Date.now(),ps={};
  for(const id in players){
    const p=players[id];
    ps[id]={x:r2(p.x),z:r2(p.z),y:r2(p.y),n:p.n,av:p.av,s:Math.floor(p.s),sp:Math.round(p.sp*10)/10,tl:p.tl,b:p.b,tp:p.tp,rg:now<p.rg?1:0,
      ps:p.ps,tr:p.tr,tw:p.tw.slice(),dx:p.dx,
      c:p.carry?[p.carry.y,p.carry.kg,p.carry.g]:null,
      q:p.eq===-1?"b":(p.eq>=0&&p.inv[p.eq]?p.inv[p.eq].slice():null),
      inv:p.inv.map(e=>e.slice()),
      pl:p.pl.map(it=>[it.k,it.y,it.k==="e"?Math.max(0,Math.ceil((it.t-now)/1000)):0,r2(it.x),r2(it.z),it.kg,it.g,it.id])};
  }
  S={t:"s",tl:Math.ceil(phaseT),nt:phaseNight,players:ps,
     eggs:eggs.map(e=>({i:e.i,y:e.y,kg:e.kg,g:e.g,x:r2(e.x),z:r2(e.z),d:e.d})),
     mon:mons.map(m=>[m.i,m.k,r2(m.x),r2(m.z),m.st])};
  sendAll(S);updateHud();
}

/* ---------- networking ---------- */
function enter(label,copy){
  $("menu").style.display="none";
  $("top").style.display="flex";$("hot").style.display="flex";$("jump").style.display="block";$("dots").style.display="flex";$("camb").style.display="flex";
  inGame=true;
  roomCode=copy||(label.indexOf("Room ")===0?label.slice(5,9):"");
  if(copy)copyLink=location.href.split("?")[0]+"?room="+copy;
  setInterval(saveNow,5000);
  addEventListener("pagehide",saveNow);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)saveNow();});
}
function profileOf(){
  if(isHost){
    const p=players.h;if(!p)return null;const now=Date.now();
    const inv=p.inv.map(e=>e.slice());p.pend.forEach(q=>{inv.push(["p",q.y,q.kg,q.g]);});
    return {s:p.s,sp:p.sp,tl:p.tl,ps:p.ps,tr:p.tr,tw:p.tw.slice(),dx:p.dx,inv:inv.slice(0,CAP),
      pl:p.pl.map(it=>({k:it.k,y:it.y,kg:it.kg,g:it.g,x:it.x,z:it.z,rem:it.k==="e"?Math.max(0,Math.ceil((it.t-now)/1000)):0}))};
  }
  const mp=S.players[myId];if(!mp)return null;
  return {s:mp.s,sp:mp.sp,tl:mp.tl,ps:mp.ps,tr:mp.tr,tw:mp.tw.slice(),dx:mp.dx,inv:mp.inv.map(e=>e.slice()),
    pl:mp.pl.map(it=>({k:it[0],y:it[1],rem:it[2],x:it[3],z:it[4],kg:it[5],g:it[6]}))};
}
function saveNow(){if(!curAcc)return;const d=profileOf();if(!d)return;curAcc.data=d;saveAccs();}
function startSolo(){
  isHost=true;isSolo=true;myId="h";initWorld();addPlayer("h",myName,curAcc&&curAcc.data);
  enter("Solo mode",null);
  setInterval(()=>{if(!paused){tick();broadcast();}},50);
}
function createRoom(pub){
  if(pub){hostPub(1);return;}
  const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join("");
  const pr=peer=new Peer("eggheist-"+code);
  pr.on("error",e=>{if(e.type==="unavailable-id"){try{pr.destroy();}catch(x){}createRoom(false);}else $("err").textContent="Connection problem: "+e.type;});
  pr.on("open",()=>setupHost(pr,code));
}
function hostPub(n){
  if(n>20){$("err").textContent="All public rooms are busy. Try a private room.";return;}
  const pr=peer=new Peer("eggpub-"+n);
  pr.on("error",e=>{if(e.type==="unavailable-id"){try{pr.destroy();}catch(x){}hostPub(n+1);}else $("err").textContent="Connection problem: "+e.type;});
  pr.on("open",()=>setupHost(pr,"P"+n));
}
function setupHost(pr,code){
  isHost=true;myId="h";initWorld();addPlayer("h",myName,curAcc&&curAcc.data);
  enter("Room "+code,code);toast("Room "+code+" is ready. Open the menu to copy the invite link.");
  setInterval(()=>{tick();broadcast();},50);
  pr.on("connection",c=>{
    c.on("data",d=>{
      if(d.t==="info"){
        c.send({t:"info",n:myName,p:Object.keys(players).length,max:3,code:code});
        setTimeout(()=>{try{c.close();}catch(x){}},400);return;
      }
      if(d.t==="hello"){
        if(players[c.peer])return;
        if(Object.keys(players).length>=3){c.send({t:"full"});setTimeout(()=>c.close(),300);return;}
        addPlayer(c.peer);conns.push(c);c.send({t:"hi",id:c.peer});return;
      }
      const p=players[c.peer];if(!p)return;
      if(d.t==="in"){
        if(d.q===p.tp&&Date.now()>=p.rg-1300){
          p.x=clamp(+d.x||0,XMIN,phaseNight?BX-.8:XEND);p.z=clamp(+d.z||0,-ZLIM,ZLIM);
        }
        p.y=clamp(+d.y||0,0,6);
      }else if(d.t==="act")act(c.peer,d.a,d.i,d.x,d.z);
      else if(d.t==="name"){const first=!p.named;p.n=cleanName(d.n);p.named=1;if(typeof d.av==="string"&&d.av.length<80)p.av=d.av;if(first){if(d.prof)loadProfile(p,d.prof);ev(p.n+" joined!");}}
    });
    c.on("close",()=>{if(players[c.peer])removePlayer(c.peer);conns=conns.filter(x=>x!==c);});
  });
}
function joinRoom(code){
  const pid=/^P\d{1,2}$/.test(code)?"eggpub-"+code.slice(1):"eggheist-"+code;
  peer=new Peer();
  peer.on("error",e=>{$("err").textContent=e.type==="peer-unavailable"?"Room not found.":"Connection problem: "+e.type;});
  peer.on("open",()=>{
    conn=peer.connect(pid,{reliable:true});
    conn.on("open",()=>{
      enter("Room "+code,null);
      conn.send({t:"hello"});
      conn.send({t:"name",n:myName,prof:curAcc&&curAcc.data,av:MYAV});
      setInterval(()=>{if(conn.open)conn.send({t:"in",x:mx,z:mz,y:jy,q:myTp});},50);
    });
    conn.on("data",d=>{
      if(d.t==="hi")myId=d.id;
      else if(d.t==="s"){S=d;updateHud();}
      else if(d.t==="ev")toast(d.m);
      else if(d.t==="kb")knockLocal(d.vx,d.vz);
      else if(d.t==="nt")showNotice(d.m);
      else if(d.t==="gf"||d.t==="gx")onGiftMsg(d);
      else if(d.t==="sw"||d.t==="ha"||d.t==="hit")onFx(d);
      else if(d.t==="full"){$("menu").style.display="flex";$("err").textContent="Room is full (3 players max).";}
    });
    conn.on("close",()=>{toast("Host left the game");});
  });
}
function doAct(a,i,x,z){
  if(isHost)act(myId,a,i,x,z);
  else if(conn&&conn.open)conn.send({t:"act",a:a,i:i,x:x,z:z});
}

/* ---------- HUD + panels ---------- */
function incOf(p){return Math.round(p.pl.reduce((a,it)=>a+(it[0]==="p"?TYPES[it[1]].inc*it[5]:0),0)*10)/10;}
function updateHud(){
  const mp=S.players[myId];
  const list=Object.entries(S.players||{}).sort((a,b)=>b[1].s-a[1].s);
  const hudH=list.map(([id,p])=>'<div class="hr'+(id===myId?" me":"")+'"><span class="hn">'+esc(p.n)+"</span>"+money(p.s)+'<span class="inc">+'+incOf(p)+'/s</span><span class="spd">&#9889; '+p.sp+"</span></div>").join("");if(hudH!==lastHud){$("hud").innerHTML=hudH;lastHud=hudH;}
  const tl=Math.max(0,S.tl||0);
  $("clock").innerHTML=(S.nt?"Sun set in "+tl+"s":"Night in "+fmtL(tl))+(roomCode?'<div class="rc">Room '+roomCode+"</div>":"");
  const cd=$("cd");
  if(!S.nt&&tl<=10&&tl>0&&mp&&mp.x>=BX){cd.style.display="block";cd.textContent="Night in "+tl+"! Run home!";}
  else cd.style.display="none";
  if(!mp)return;
  if(mp.c&&sel!==-2)sel=-2;
  if(sel>=0&&!mp.inv[sel])sel=-2;
  if(performance.now()-selT>700){
    if(sel>=0&&!Array.isArray(mp.q))sel=-2;
    if(sel===-1&&mp.q!=="b")sel=-2;
  }
  $("pbar").style.display=sel>=0?"block":"none";
  let gn=null,gd=6;
  for(const k in S.players){if(k===myId)continue;const o=S.players[k],d=Math.hypot(o.x-mx,o.z-mz);if(d<gd){gd=d;gn=k;}}
  giftTarget=gn;
  const gb=$("giftb"),gshow=sel>=0&&Array.isArray(mp.q)&&mp.q[0]==="p"&&gn;
  gb.style.display=gshow?"block":"none";if(gshow)gb.textContent="Gift to "+S.players[gn].n;
  const b=$("buy");
  b.textContent=mp.tl>=10?"Treadmill maxed":"\u{1F3C3} Lv "+(mp.tl+1)+" (\u{1F4B0}"+fmtN(upCost(mp.tl))+")";
  b.style.opacity=mp.tl<10&&mp.s>=upCost(mp.tl)?1:.6;
  let h='<div class="slot on'+(sel===-1?" sel":"")+'" data-s="-1"><i class="bat"></i></div>';
  for(let i=0;i<HOT;i++){
    const e=mp.inv[i];
    h+=e?'<div class="slot on'+(e[3]?" g":"")+(sel===i?" sel":"")+'" data-s="'+i+'">'+icon(e[0],e[1],26)+"<b>"+kgs(e[2])+"</b></div>":'<div class="slot"></div>';
  }
  if(h!==lastHot){$("hot").innerHTML=h;lastHot=h;}
  renderPanel(mp);

document.addEventListener("pointerdown",e=>{

function step(dx,dz,lim){

  if(blocked(mx,mz,nx,mz))nx=mx;
  let nz=clamp(mz+dz,-ZLIM,ZLIM);

function groundPoint(cx,cy){

  if(d.y>-.02)return null;

}

function startHatch(d){

  const bm=egg.children[0].material;bm.transparent=true;bm.opacity=.5;

function updateAnims(t,dt){
  for(let i=anims.length-1;i>=0;i--){
    const a=anims[i],e=t-a.t0,pf=.95*a.sf;let done=false;
    if(a.state===0){
      if(e<1.7){
        const k=e/1.7;

        const dx=walker.position.x-a.pet.position.x,dz=walker.position.z-a.pet.position.z,l=Math.hypot(dx,dz);

/* ---------- trails: a light ribbon that follows the player and fades ---------- */
const TN=70,TLIFE=1.8,rib={};
const trailMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,
  vertexShader:"attribute vec4 col;varying vec4 vC;void main(){vC=col;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
  fragmentShader:"varying vec4 vC;void main(){gl_FragColor=vC;}"});
const tmpC=new THREE.Color();
function newRibbon(){
  const geo=new THREE.BufferGeometry(),pos=new Float32Array(TN*6),col=new Float32Array(TN*8),idx=[];
  for(let i=0;i<TN-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  geo.setAttribute("col",new THREE.BufferAttribute(col,4));
  geo.setIndex(idx);
  const m=new THREE.Mesh(geo,trailMat);m.frustumCulled=false;scene.add(m);
  return {m:m,geo:geo,pos:pos,col:col,pts:[],seq:0};
}
function updateRibbon(id,p,x,z,on,dt){
  let r=rib[id];
  if(!r){if(!p.tr)return;r=rib[id]=newRibbon();}
  const tr=p.tr?TRAILS[p.tr-1]:null;
  if(on&&tr){
    if(!r.pts.length||Math.hypot(r.pts[0].x-x,r.pts[0].z-z)>.35)r.pts.unshift({x:x,z:z,age:0,c:r.seq++});
    else{r.pts[0].x=x;r.pts[0].z=z;}
    if(r.pts.length>TN)r.pts.pop();
  }
  r.pts.forEach(q=>{q.age+=dt;});
  while(r.pts.length&&r.pts[r.pts.length-1].age>TLIFE)r.pts.pop();
  const n=r.pts.length;
  if(!n&&!p.tr){scene.remove(r.m);delete rib[id];return;}
  const cols=(tr||TRAILS[0]).c;
  for(let i=0;i<n;i++){
    const q=r.pts[i],pv=r.pts[i-1]||q,nx=r.pts[i+1]||q;
    let dx=pv.x-nx.x,dz=pv.z-nx.z,l=Math.hypot(dx,dz);
    if(l<.001){dx=1;dz=0;l=1;}
    const ux=-dz/l,uz=dx/l,life=q.age/TLIFE,w=(.45+.04*(p.tr||1))*(1-life*.7),al=.5*Math.pow(1-life,1.3);
    r.pos.set([q.x+ux*w,.22,q.z+uz*w,q.x-ux*w,.22,q.z-uz*w],i*6);
    tmpC.setHex(cols[q.c%cols.length]);
    const cr=tmpC.r+(1-tmpC.r)*.35,cg=tmpC.g+(1-tmpC.g)*.35,cb=tmpC.b+(1-tmpC.b)*.35;
    r.col.set([cr,cg,cb,al,cr,cg,cb,al],i*8);
  }
  r.geo.attributes.position.needsUpdate=true;r.geo.attributes.col.needsUpdate=true;
  r.geo.setDrawRange(0,Math.max(0,n-1)*6);r.m.visible=n>1;
}

    if(!mp.c&&!rag){

          const a=rr(0,6.28),r=rr(0,2.6);let tx=w.bx+Math.cos(a)*r,tz=w.bz+Math.sin(a)*r;
          const ddx=tx-pl.x,ddz=tz-pl.z,dd=Math.hypot(ddx,ddz);
          if(dd>R-1.5){tx=pl.x+ddx/dd*(R-1.5);tz=pl.z+ddz/dd*(R-1.5);}
          w.tx=tx;w.tz=tz;w.wait=t+rr(.3,2);
        }
        if(t>w.wait){
          const ddx=w.tx-o.position.x,ddz=w.tz-o.position.z,l=Math.hypot(ddx,ddz)||1;
          o.position.x+=ddx/l*1.2*dt;o.position.z+=ddz/l*1.2*dt;
          o.rotation.y=Math.atan2(ddx,ddz);o.position.y=Math.abs(Math.sin(t*8+j))*.1;
        }else o.position.y=0;
      }else{
        o.position.y=.05;o.rotation.z=w.ready?Math.sin(t*12)*.2:0;
      }
    }
  }
  for(const id in pm)if(!S.players[id]){scene.remove(pm[id]);delete pm[id];if(plg[id])scene.remove(plg[id].grp);delete plg[id];if(rib[id]){scene.remove(rib[id].m);delete rib[id];}}
  /* eggs in nests (no spinning) */
  const seen={};
  for(const e of S.eggs){
    seen[e.i]=1;const m=em[e.i]||(em[e.i]=eggMesh(e));
    m.position.set(e.x,e.d?0:.12,e.z);
    m.userData.ol.visible=!!near&&near.i===e.i;
  }
  for(const i in em)if(!seen[i]){scene.remove(em[i]);delete em[i];}
  /* monsters */
  const mseen={};
  for(const a of S.mon){
    mseen[a[0]]=1;const m=mm[a[0]]||(mm[a[0]]=makeMon(a[1]));
    if(m.userData.init===undefined){m.position.set(a[2],0,a[3]);m.userData.init=1;}
    const ox=m.position.x,oz=m.position.z;
    m.position.x+=(a[2]-ox)*.35;m.position.z+=(a[3]-oz)*.35;
    const vx=m.position.x-ox,vz=m.position.z-oz;
    if(Math.hypot(vx,vz)>.02&&Math.hypot(vx,vz)<4)m.rotation.y=Math.atan2(vx,vz);
    const u=m.userData,base=MONS[a[1]].sc,st=a[4]||0;
    u.slp=(u.slp||0)+((st===0?1:0)-(u.slp||0))*Math.min(1,dt*6);
    m.scale.set(base,base*(1-.3*u.slp+Math.sin(t*2+a[0])*.02*u.slp),base);
    if(u.eye)u.eye.scale.y=1-.85*u.slp;
    m.rotation.z=st===1?Math.sin(t*50)*.08:0;
    m.position.y=st===0?0:Math.abs(Math.sin(t*10+a[0]))*.12;
    if(!u.zz){u.zz=tag("zzZZ",3.4,"#cfe8ff");scene.add(u.zz);u.ex=tag("!",1.6,"#ff5a5a");scene.add(u.ex);}
    const ph=(t*.6+a[0]*.37)%1;
    const dmn=Math.hypot(m.position.x-mx,m.position.z-mz);
    u.zz.visible=u.slp>.6&&dmn<30;u.zz.position.set(m.position.x+.6*base,base*2.4+ph*1.3,m.position.z);u.zz.material.opacity=Math.sin(ph*3.14);
    u.ex.visible=st===1;u.ex.position.set(m.position.x,base*2.9+Math.abs(Math.sin(t*14))*.3,m.position.z);
  }
  for(const i in mm)if(!mseen[i]){const u=mm[i].userData;if(u.zz){scene.remove(u.zz);scene.remove(u.ex);}scene.remove(mm[i]);delete mm[i];}
  if((fc=(fc+1)%6)===0)updateLabels();
  updateAnims(t,dt);updateBursts(dt);
  if(mp){
    const cd2=freeCam?camDist:25,cp=freeCam?camPitch:.9273,cyw=freeCam?camYaw:0;
    cam.position.set(mx+Math.sin(cyw)*cd2*Math.cos(cp),cd2*Math.sin(cp),mz+Math.cos(cyw)*cd2*Math.cos(cp));
    cam.lookAt(mx,0,mz);
  }
  renderer.render(scene,cam);
}
frame();

/* ---------- GameExpVault link: shared avatar + name (same site storage) ---------- */
const HUB_URL="index.html";
let HUBUSER=null,MYAV="";
(function(){try{
  const u=JSON.parse(localStorage.getItem("gev_session")||"null");
  if(u){HUBUSER=String(u);const a=JSON.parse(localStorage.getItem("gev_av_"+HUBUSER.toLowerCase())||"null");
    if(a)MYAV=[a.skin,a.shirt,a.pants,a.acc,a.design].join("|");}
}catch(e){}})();
function parseAv(str){
  const d={skin:0xf5cd30,shirt:0x3d7fe0,pants:0x2c3e87,acc:"none",design:"plain"};
  if(typeof str!=="string")return d;
  const a=str.split("|"),hx=v=>/^#[0-9a-fA-F]{6}$/.test(v)?parseInt(v.slice(1),16):null;
  const k=hx(a[0]),sh=hx(a[1]),pa=hx(a[2]);
  if(k!==null)d.skin=k;if(sh!==null)d.shirt=sh;if(pa!==null)d.pants=pa;
  if(["cap","crown","glasses","phones"].includes(a[3]))d.acc=a[3];
  if(["stripe","emblem"].includes(a[4]))d.design=a[4];
  return d;
}
/* adds shirt design + accessory to a player group (torso centre y1.8, head centre y2.9) */
function avParts(g,A){
  const gold=0xd9a73f,lt=c=>{const f=v=>Math.round(v+(255-v)*.6);return (f(c>>16&255)<<16)|(f(c>>8&255)<<8)|f(c&255);};
  if(A.design==="stripe"){bx(g,1.22,.2,.62,lt(A.shirt),0,2.05,0);bx(g,1.22,.2,.62,lt(A.shirt),0,1.55,0);}
  if(A.design==="emblem"){const t=new THREE.Mesh(new THREE.TorusGeometry(.28,.05,8,20),mat(gold));t.position.set(0,1.8,.31);g.add(t);bx(g,.12,.12,.04,gold,0,1.8,.31);}
  if(A.acc==="cap"){bx(g,1.02,.28,1.02,0xd9534f,0,3.5,0);bx(g,1.0,.06,.45,0xa83a36,0,3.38,.62);}
  if(A.acc==="crown"){bx(g,1.0,.2,1.0,gold,0,3.47,0);[[-.38,-.38],[.38,-.38],[-.38,.38],[.38,.38]].forEach(p=>bx(g,.16,.3,.16,gold,p[0],3.72,p[1]));}
  if(A.acc==="glasses"){bx(g,.3,.22,.05,0x3fd0c0,-.22,3.0,.5);bx(g,.3,.22,.05,0x3fd0c0,.22,3.0,.5);bx(g,.8,.04,.05,0x111111,0,3.1,.51);}
  if(A.acc==="phones"){const a=new THREE.Mesh(new THREE.TorusGeometry(.55,.05,8,20,Math.PI),mat(0x222222));a.position.set(0,2.9,0);g.add(a);bx(g,.15,.4,.4,0x3fd0c0,-.55,2.9,0);bx(g,.15,.4,.4,0x3fd0c0,.55,2.9,0);}
}
/* ---------- menu ---------- */
const roomParam=new URLSearchParams(location.search).get("room");
/* ---------- main menu: your face + Solo / Multiplayer. Progress saves by itself on this device ---------- */
let curAcc=null,inGame=false,pres=null,avURL="";
const roomParam2=roomParam;
function saveAccs(){try{localStorage.setItem("eh_save",JSON.stringify({name:curAcc.name,data:curAcc.data}));}catch(e){}}
(function(){
  let sv=null;
  try{sv=JSON.parse(localStorage.getItem("eh_save")||"null");}catch(e){}
  if(!sv){try{const old=JSON.parse(localStorage.getItem("eh_accounts")||"[]");if(Array.isArray(old)&&old[0])sv={name:old[0].name,data:old[0].data};}catch(e){}}
  const nm=HUBUSER?cleanName(HUBUSER):sv&&typeof sv.name==="string"&&sv.name.trim()?cleanName(sv.name):"Player"+Math.floor(1000+Math.random()*9000);
  curAcc={name:nm,data:sv&&sv.data&&typeof sv.data==="object"?sv.data:null};
  myName=curAcc.name;
})();
function show(id){
  ["s2","mp"].forEach(k=>{$(k).style.display=k===id?"flex":"none";});$("err").textContent="";
  if(id==="s2")renderMenu();
}
function needNet(){if(typeof Peer==="undefined"){$("err").textContent="Online play needs an internet connection.";return true;}return false;}
function goFull(){
  const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(!f)return false;
  try{const r=f.call(el);if(r&&r.catch)r.catch(()=>{});}catch(e){}
  return true;
}
/* avatar: a real 3D render of the blocky avatar, shown in a circle */
function getAvatar(){
  if(avURL)return avURL;
  try{
    const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
    r.setSize(160,160);r.setPixelRatio(1);
    const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0x8899aa,1.1));
    const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(2,3,4);sc.add(dl);
    const A=parseAv(MYAV),g=new THREE.Group();
    bx(g,1.2,1.2,.6,A.shirt,0,1.8,0);bx(g,.95,.95,.95,A.skin,0,2.9,0);
    bx(g,.14,.18,.05,0x111111,-.22,2.95,.49);bx(g,.14,.18,.05,0x111111,.22,2.95,.49);bx(g,.5,.08,.05,0x111111,0,2.65,.49);
    avParts(g,A);g.rotation.y=-.35;sc.add(g);
    const c=new THREE.PerspectiveCamera(32,1,.1,50);c.position.set(0,3.0,3.9);c.lookAt(0,2.75,0);
    r.render(sc,c);avURL=r.domElement.toDataURL("image/png");r.dispose();if(r.forceContextLoss)r.forceContextLoss();
  }catch(e){avURL="";}
  if(!avURL||typeof avURL!=="string")avURL="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#ffe9a8"/><rect x="8" y="8" width="24" height="24" fill="#f5cd30"/><rect x="14" y="14" width="3" height="5" fill="#111"/><rect x="23" y="14" width="3" height="5" fill="#111"/><rect x="15" y="25" width="10" height="2" fill="#111"/><rect x="4" y="34" width="32" height="6" fill="#3d7fe0"/></svg>');
  return avURL;
}
function renderMenu(){
  $("avimg").src=getAvatar();
  $("hubname").textContent=curAcc.name;
}
$("tohub").onclick=()=>{location.href=HUB_URL;};
$("hubname").onclick=()=>{
  if(HUBUSER){toast("Your name comes from your GameExpVault account.");return;}
  let v=null;try{v=prompt("Your name",curAcc.name);}catch(e){}
  if(v===null||v===undefined)return;
  const n=cleanName(v);curAcc.name=n;myName=n;saveAccs();renderMenu();
};

/* live servers: public rooms use ids eggpub-1..20, so we can ask each one if it is online */
let probe=null;
function renderSrv(list,fin){
  const b=$("srv");
  if(!list.length){b.innerHTML='<p class="dim">'+(fin?"No public rooms right now. Make one!":"Searching...")+"</p>";return;}
  b.innerHTML=list.slice().sort((a,c)=>a.code>c.code?1:-1).map(v=>{
    const full=v.p>=v.max;
    return '<div class="fr"><span class="avs"><img src="'+getAvatar()+'" alt=""></span><span class="fn">'+esc(v.n)+"'s room<small class=\"on\">&#9679; "+v.p+"/"+v.max+" players</small></span>"+
      (full?'<button class="sq2" disabled>Full</button>':'<button class="sq2" data-js="'+esc(v.code)+'">Join</button>')+"</div>";
  }).join("");
}
function scanServers(){
  const box=$("srv");
  if(typeof Peer==="undefined"){box.innerHTML='<p class="dim">Live servers need an internet connection.</p>';return;}
  renderSrv([],false);
  if(probe){try{probe.destroy();}catch(e){}}
  const found=[],pr=probe=new Peer();
  pr.on("error",()=>{});
  pr.on("open",()=>{
    for(let n=1;n<=20;n++){
      const c=pr.connect("eggpub-"+n);
      c.on("open",()=>c.send({t:"info"}));
      c.on("data",d=>{
        if(d.t==="info"&&/^P\d{1,2}$/.test(d.code||"")&&!found.some(f=>f.code===d.code)){
          found.push({n:cleanName(d.n),p:clamp(+d.p||0,0,3),max:3,code:d.code});renderSrv(found,false);
          try{c.close();}catch(x){}
        }
      });
    }
    setTimeout(()=>{renderSrv(found,true);try{pr.destroy();}catch(x){}if(probe===pr)probe=null;},5500);
  });
}
$("srv").addEventListener("click",e=>{const j=e.target.closest("[data-js]");if(j){goFull();if(needNet())return;joinRoom(j.dataset.js);}});
$("refresh").onclick=()=>scanServers();
$("fsbtn").onclick=()=>{
  if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)document.exitFullscreen();}
  else if(!goFull())toast("Fullscreen is not supported here. On iPhone use Share > Add to Home Screen.");
};
function setFree(on){
  freeCam=on;if(!on){camYaw=0;camPitch=.9273;camDist=25;}
  $("freecam").textContent="Free camera: "+(on?"On":"Off");$("camb").classList.toggle("on",on);
  toast(on?"Free camera on: drag to look around, scroll or pinch to zoom":"Free camera off");
}
$("freecam").onclick=()=>setFree(!freeCam);
$("camb").onclick=()=>setFree(!freeCam);
$("copylink").onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(copyLink);toast("Invite link copied");};
$("dots").onclick=()=>{
  $("pause").style.display="flex";$("ptitle").textContent=isSolo?"Paused":"Menu";if(isSolo)paused=true;
  $("roomtxt").textContent=roomCode?"Room "+roomCode:"";$("copylink").style.display=copyLink?"block":"none";
};
$("resume").onclick=()=>{$("pause").style.display="none";paused=false;};
$("tomenu").onclick=()=>{saveNow();try{if(pres)pres.destroy();}catch(e){}location.href=location.href.split("?")[0];};
$("solo").onclick=()=>{goFull();startSolo();};
$("multi").onclick=()=>{show("mp");scanServers();};
$("back").onclick=()=>show("s2");
$("createpub").onclick=()=>{goFull();if(needNet())return;$("err").textContent="Opening a public room...";createRoom(true);};
$("createpriv").onclick=()=>{goFull();if(needNet())return;$("err").textContent="Creating a private room...";createRoom(false);};
$("join").onclick=()=>{
  goFull();if(needNet())return;
  const c=$("code").value.trim().toUpperCase();
  if(c.length<2){$("err").textContent="Enter the room code.";return;}
  $("err").textContent="Joining...";joinRoom(c);
};
if(roomParam)$("code").value=roomParam.toUpperCase();
show(roomParam?"mp":"s2");
if(roomParam)scanServers();
