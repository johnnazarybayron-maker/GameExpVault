<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TerraBloxsCraft</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>:root{color-scheme:dark;--bg:#1a1511;--panel:#2e251d;--panel2:#40332a;--ink:#0f0b08;--edge:#5f4a36;--text:#f6efe3;--mute:#bba98f;--grass:#6cc24a;--grass2:#4f9c34;--grass3:#2e6a1b;--dirt:#8a5a33;--exp:#ffb21e;--ok:#6cc24a;--bad:#ff6b5a;--accent:#6cc24a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:600 15px/1.45 Nunito,system-ui,sans-serif;min-height:100vh;background-color:var(--bg);background-image:linear-gradient(rgba(255,255,255,.03) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.03) 2px,transparent 2px);background-size:44px 44px}
h1,h2,.logo{font-family:"Pixelify Sans","Courier New",monospace;font-weight:700;margin:0}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--exp);outline-offset:2px}
[hidden]{display:none!important}
.btn{background:var(--grass);color:#10230a;padding:12px 18px;border-radius:4px;font-weight:800;border:3px solid var(--ink);box-shadow:inset 0 4px 0 #9be07a,inset 0 -4px 0 var(--grass2),0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 4px 0 #9be07a,inset 0 -4px 0 var(--grass2),0 1px 0 var(--ink)}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:inset 0 3px 0 #54443a,inset 0 -4px 0 #2a2019,0 4px 0 var(--ink)}
.wm{font-size:clamp(22px,7vw,34px);line-height:1;color:var(--text);text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.wm b{color:var(--grass);font-weight:700}.wm i{font-style:normal;color:var(--exp)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px}
.logo svg{width:44px;height:44px;flex:none;filter:drop-shadow(0 3px 0 var(--ink))}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(420px,100%);border:4px solid var(--ink);border-radius:6px;padding:34px 24px 24px;box-shadow:0 8px 0 var(--ink);background:linear-gradient(var(--grass) 0 12px,var(--grass2) 12px 18px,var(--dirt) 18px 22px,transparent 22px),var(--panel)}
.card .logo{flex-direction:column;gap:6px;margin-top:6px}.card .logo svg{width:72px;height:72px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:3px solid var(--ink);border-radius:4px;padding:3px;margin:18px 0}
.tabs button{background:none;padding:10px;border-radius:2px;color:var(--mute);font-weight:800}
.tabs button[aria-selected=true]{background:var(--grass);color:#10230a}
label{display:block;margin:12px 0 5px;color:var(--mute);font-size:13px}
input{width:100%;background:var(--bg);border:3px solid var(--edge);border-radius:4px;padding:11px 12px}
input:focus{border-color:var(--grass);outline:0}
.err{color:var(--bad);min-height:20px;margin:10px 0 0;font-size:14px}
.card .btn{width:100%;margin-top:10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:6px solid var(--grass2);box-shadow:0 4px 0 var(--ink)}
header .logo{margin-right:auto}header .wm{font-size:clamp(15px,5vw,24px)}header .logo svg{width:34px;height:34px}
.exp{display:flex;align-items:center;gap:6px;background:var(--bg);padding:4px 10px 4px 5px;border-radius:4px;border:3px solid var(--ink);font-weight:800}
.exp svg{width:26px;height:26px}
.gear{background:var(--panel2);width:42px;height:42px;border-radius:4px;font-size:20px;border:3px solid var(--ink)}
.menu{position:absolute;right:14px;top:66px;background:var(--panel2);border:3px solid var(--ink);border-radius:4px;padding:6px;width:210px;box-shadow:0 5px 0 var(--ink)}
.menu button{display:block;width:100%;text-align:left;background:none;padding:11px 12px;border-radius:2px;font-weight:800}
.menu button:hover{background:var(--edge)}.menu .out{color:var(--bad)}
main{max-width:980px;margin:0 auto;padding:20px 16px 100px}
section{margin-top:28px}
h2{font-size:24px;margin-bottom:12px;text-shadow:2px 2px 0 var(--ink)}
.me{display:flex;align-items:center;gap:20px;border:4px solid var(--ink);border-radius:6px;padding:30px 22px 18px;box-shadow:0 6px 0 var(--ink);background:linear-gradient(var(--grass) 0 10px,var(--grass2) 10px 14px,transparent 14px),linear-gradient(180deg,#5b4430,#3a2c20)}
.me h1{font-size:32px;word-break:break-all;text-shadow:3px 3px 0 var(--ink)}.me p{margin:2px 0;color:#e6d5b8}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--ink);border-radius:4px;padding:5px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip svg{width:18px;height:18px}
.scene{width:150px;height:200px;perspective:700px;flex:none;display:grid;place-items:center;cursor:grab;touch-action:none}
.av3{position:relative;width:0;height:0;transform-style:preserve-3d;animation:sway 5s ease-in-out infinite}
.av3.drag{animation:none}
@keyframes sway{0%,100%{transform:rotateX(-6deg) rotateY(-35deg)}50%{transform:rotateX(-4deg) rotateY(15deg)}}
.cb{position:absolute;left:0;top:0;transform-style:preserve-3d}
.f{position:absolute;backface-visibility:hidden;border-radius:6px}
.f i{position:absolute;background:#111}
.mf{position:relative;display:block;width:100%;height:100%;border-radius:inherit;background:#f5cd30}
.mf i{position:absolute;top:34%;width:14%;height:20%;background:#111}.mf i:first-child{left:27%}.mf i:nth-child(2){right:27%}
.mf u{position:absolute;left:30%;right:30%;bottom:20%;height:8%;background:#111}
.empty{margin:0;padding:18px;border:2px dashed var(--line);border-radius:16px;color:var(--mute);width:100%;text-align:center}
.row{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.fr{flex:none;width:84px;text-align:center;background:none}
.av{position:relative;width:70px;height:70px;border-radius:4px;margin:0 auto 6px;border:3px solid var(--ink);background:#f5cd30}
.av>i{position:absolute;z-index:1;right:-5px;bottom:-5px;width:16px;height:16px;border:3px solid var(--ink);background:#6b6458}
.av>i.on{background:var(--ok)}.av>i.pl{background:var(--exp)}
.fr small{display:block;color:var(--mute);font-size:12px}.fr b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile{flex:none;width:176px;text-align:left;background:var(--panel);border:4px solid var(--ink);border-radius:6px;overflow:hidden;padding:0;box-shadow:0 5px 0 var(--ink);color:var(--text)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tile .art{position:relative;height:118px;display:grid;place-items:center;font-size:46px}
.tile .art::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(var(--grass) 0 9px,var(--grass2) 9px 14px);border-bottom:3px solid var(--ink)}
.tile .art svg{margin-top:12px}
.tile .tx{padding:9px 11px 11px}.tile b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{color:var(--mute);font-size:12px}
.bar{height:8px;background:var(--bg);border:2px solid var(--ink);margin-top:8px}.bar u{display:block;height:100%;background:var(--grass)}
.empty{margin:0;padding:18px;border:3px dashed var(--edge);border-radius:4px;color:var(--mute);width:100%;text-align:center}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--panel2);border:3px solid var(--ink);padding:10px 18px;border-radius:4px;z-index:20;box-shadow:0 4px 0 var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--panel);border-top:6px solid var(--edge);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;color:var(--mute);padding:6px 14px;font-size:12px;font-weight:800;border-radius:4px}
nav button span{display:block;font-size:20px}nav .on{color:#10230a;background:var(--grass)}
dialog{background:var(--panel);color:var(--text);border:4px solid var(--ink);border-radius:6px;width:min(380px,92vw);padding:20px;box-shadow:0 8px 0 var(--ink)}
dialog::backdrop{background:#000b}
.acct{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel2);padding:10px;border-radius:4px;margin-top:8px;text-align:left;border:3px solid var(--ink)}
.acct .av{width:40px;height:40px;margin:0;border-width:2px;flex:none}
@media(max-width:520px){.me{flex-direction:column;text-align:center}.stats{justify-content:center}}
@media(prefers-reduced-motion:reduce){.av3{animation:none;transform:rotateX(-6deg) rotateY(-20deg)}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset=".55" stop-color="#ffb21e"/><stop offset="1" stop-color="#f26a1b"/></linearGradient>
<symbol id="gb" viewBox="0 0 64 64"><path d="M32 6 58 20 32 34 6 20z" fill="#6cc24a"/><path d="M6 20 32 34v26L6 46z" fill="#8a5a33"/><path d="M58 20 32 34v26l26-14z" fill="#6e4524"/><path d="M6 20 32 34v8L6 28z" fill="#4f9c34"/><path d="M58 20 32 34v8l26-14z" fill="#3f822a"/><path d="M32 6 58 20 32 34 6 20zM6 20v26l26 14 26-14V20" fill="none" stroke="#0f0b08" stroke-width="3" stroke-linejoin="round"/><path d="M32 34v26" stroke="#0f0b08" stroke-width="3"/><path d="M14 40h5v5h-5zM42 46h5v5h-5zM22 50h4v4h-4z" fill="#5a3a1e"/></symbol><symbol id="exp" viewBox="0 0 64 64"><path d="M32 3 56 17v30L32 61 8 47V17z" fill="url(#g1)" stroke="#a8430c" stroke-width="3" stroke-linejoin="round"/><path d="M32 9 51 20v24L32 55 13 44V20z" fill="none" stroke="#fff6c9" stroke-opacity=".6" stroke-width="2"/><path d="M36 14 21 35h9l-3 15 16-23h-9z" fill="#fff" stroke="#a8430c" stroke-width="2.5" stroke-linejoin="round"/><path d="M51 6v8M47 10h8" stroke="#fff" stroke-width="3" stroke-linecap="round"/></symbol></defs></svg>

<div id="auth" hidden><div class="card">
<div class="logo"><svg><use href="#gb"/></svg><span class="wm"><b>Terra</b><i>Blox</i>sCraft</span></div>
<div class="tabs" role="tablist"><button role="tab" id="tUp" aria-selected="true">Sign up</button><button role="tab" id="tIn" aria-selected="false">Log in</button></div>
<div><label for="u">Username</label><input id="u" autocomplete="username" maxlength="16">
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
<div id="cw"><label for="c">Confirm password</label><input id="c" type="password" autocomplete="new-password"></div>
<p class="err" id="err" role="alert"></p><button class="btn" id="go">Create account</button></div>
</div></div>

<div id="hub" hidden>
<header><div class="logo"><svg><use href="#gb"/></svg><span class="wm"><b>Terra</b><i>Blox</i>sCraft</span></div>
<div class="exp" title="Exp balance"><svg><use href="#exp"/></svg><span id="bal">0</span></div>
<button class="gear" id="gear" aria-label="Settings" aria-expanded="false">⚙️</button>
<div class="menu" id="menu" hidden><button id="sw">🔁 Switch account</button><button id="lo" class="out">🚪 Log out</button></div></header>
<main>
<div class="me"><div class="scene" id="scene" aria-label="Your avatar, drag to rotate"><div class="av3" id="av3"></div></div>
<div><h1 id="nm"></h1><p id="hd"></p><div class="stats"><span class="chip"><svg><use href="#exp"/></svg><b id="bal2"></b> Exp</span><span class="chip">👥 0 friends</span><span class="chip">🏅 Level 1</span></div></div></div>
<section><h2>Friends</h2><div class="row" id="fr"></div></section>
<section><h2>Continue playing</h2><div class="row" id="co"></div></section>
<section><h2>Recommended for you</h2><div class="row" id="re"></div></section>
</main>
<nav><button class="on"><span>🏠</span>Home</button><button data-t="1"><span>🧭</span>Discover</button><button data-t="1"><span>👥</span>Friends</button><button data-t="1"><span>🛍️</span>Shop</button></nav>
</div>

<dialog id="dlg"><h2>Switch account</h2><div id="list"></div><div id="pwBox" hidden><label for="sp">Password for <b id="who"></b></label><input id="sp" type="password"><p class="err" id="serr"></p><button class="btn" id="sgo">Switch</button></div><button class="btn ghost" style="width:100%;margin-top:14px" id="close">Cancel</button></dialog>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);let mem={};
const L={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const accts=()=>{try{return JSON.parse(L.get('ph_accts'))||{}}catch(e){return{}}};
const save=a=>L.set('ph_accts',JSON.stringify(a));
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const skin=n=>`hsl(${hue(n)},65%,62%)`;
let mode='up',cur=null,pick=null;
const FR=[];
const EGG='<svg width="66" height="78" aria-label="Egg Heist" viewBox="0 0 92 108"> <ellipse cx="46" cy="60" rx="38" ry="46" fill="#fff3d6" stroke="#b5651d" stroke-width="4"/> <path d="M12 52 L24 44 L34 54 L46 42 L58 54 L68 44 L80 52" fill="none" stroke="#e0b26b" stroke-width="3" stroke-linejoin="round"/> <circle cx="32" cy="70" r="5" fill="#4a2e12"/><circle cx="60" cy="70" r="5" fill="#4a2e12"/> <circle cx="30.5" cy="68" r="1.8" fill="#fff"/><circle cx="58.5" cy="68" r="1.8" fill="#fff"/> <ellipse cx="22" cy="82" rx="7" ry="4.5" fill="#ffa8a8"/><ellipse cx="70" cy="82" rx="7" ry="4.5" fill="#ffa8a8"/> <path d="M38 84 Q46 93 54 84" fill="none" stroke="#4a2e12" stroke-width="3.5" stroke-linecap="round"/> <path d="M40 18 L46 4 L52 18 Z" fill="#ffd23f" stroke="#b5651d" stroke-width="2.5" stroke-linejoin="round"/> </svg>';
const GA=[['Egg Heist',EGG,'#ffd23f','#e08a1e',0,'game.html']];
function show(v){$('#auth').hidden=v!=='auth';$('#hub').hidden=v!=='hub';if(v!=='hub')$('#menu').hidden=true}
function setMode(m){mode=m;$('#tUp').setAttribute('aria-selected',m==='up');$('#tIn').setAttribute('aria-selected',m==='in');$('#cw').hidden=m==='in';$('#go').textContent=m==='up'?'Create account':'Log in';$('#err').textContent='';$('#p').autocomplete=m==='up'?'new-password':'current-password'}
$('#tUp').onclick=()=>setMode('up');$('#tIn').onclick=()=>setMode('in');
$('#go').onclick=()=>{const u=$('#u').value.trim(),p=$('#p').value,a=accts(),e=$('#err');
 if(!/^[A-Za-z0-9_]{3,16}$/.test(u))return e.textContent='Username must be 3–16 letters, numbers or underscores.';
 if(mode==='up'){if(p.length<6)return e.textContent='Password needs at least 6 characters.';
  if(p!==$('#c').value)return e.textContent='Passwords don’t match. Type the same password in both boxes.';
  if(Object.keys(a).some(k=>k.toLowerCase()===u.toLowerCase()))return e.textContent='That username is taken. Try another one.';
  a[u]={h:hash(p),exp:500};save(a);login(u)}
 else{const k=Object.keys(a).find(k=>k.toLowerCase()===u.toLowerCase());
  if(!k||a[k].h!==hash(p))return e.textContent='Wrong username or password.';login(k)}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#auth').hidden)$('#go').click()});
function login(u){cur=u;L.set('ph_cur',u);['#u','#p','#c'].forEach(s=>$(s).value='');$('#err').textContent='';render();show('hub')}
function render(){const a=accts()[cur];$('#nm').textContent=cur;$('#hd').textContent='@'+cur.toLowerCase();
 $('#bal').textContent=$('#bal2').textContent=a.exp.toLocaleString();
 if(!$('#av3').firstChild)buildAvatar();
 $('#fr').innerHTML=FR.length?'':'<p class="empty">No friends yet. Friends you add will show up here.</p>'
 $('#co').innerHTML=GA.map(([n,e,c1,c2,p,go])=>`<button class="tile" ${go?'data-go="'+go+'"':'data-t="1"'}><div class="art" style="background:linear-gradient(135deg,${c1},${c2})">${e}</div><div class="tx"><b>${n}</b><small>${go?'Solo or with friends':p+'% complete'}</small><div class="bar"><u style="width:${p}%"></u></div></div></button>`).join('');
 $('#re').innerHTML='<p class="empty">No recommendations yet. New games will show up here.</p>'}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){location.href=g.dataset.go;return}if(e.target.closest('[data-t]'))toast('This part is coming soon.')});
$('#gear').onclick=()=>{const m=$('#menu');m.hidden=!m.hidden;$('#gear').setAttribute('aria-expanded',!m.hidden)};
$('#lo').onclick=()=>{L.set('ph_cur','');cur=null;setMode('in');show('auth')};
$('#sw').onclick=()=>{$('#menu').hidden=true;pick=null;$('#pwBox').hidden=true;const a=accts();
 $('#list').innerHTML=Object.keys(a).map(n=>`<button class="acct" data-n="${n}"><div class="av"><span class="mf" style="border-radius:50%;overflow:hidden"><i></i><i></i><u></u></span></div><span>${n}${n===cur?' (current)':''}</span></button>`).join('')+'<button class="acct" id="add">➕ Add another account</button>';
 $('#dlg').showModal()};
$('#list').onclick=e=>{const b=e.target.closest('.acct');if(!b)return;
 if(b.id==='add'){$('#dlg').close();$('#lo').click();setMode('up');return}
 pick=b.dataset.n;$('#who').textContent=pick;$('#pwBox').hidden=false;$('#sp').value='';$('#serr').textContent='';$('#sp').focus()};
$('#sgo').onclick=()=>{const a=accts();if(a[pick]&&a[pick].h===hash($('#sp').value)){$('#dlg').close();login(pick)}else $('#serr').textContent='Wrong password.'};
$('#close').onclick=()=>$('#dlg').close();
// default avatar: same blocky character as the game (yellow head, blue body)
function mkCube(w,h,d,col,y,face){const c=document.createElement('div');c.className='cb';c.style.transform=`translateY(${y}px)`;
 [[w,h,`translateZ(${d/2}px)`,1],[w,h,`rotateY(180deg) translateZ(${d/2}px)`,.8],[d,h,`rotateY(-90deg) translateZ(${w/2}px)`,.85],[d,h,`rotateY(90deg) translateZ(${w/2}px)`,.85],[w,d,`rotateX(90deg) translateZ(${h/2}px)`,1.1],[w,d,`rotateX(-90deg) translateZ(${h/2}px)`,.7]].forEach(([a,b,t,br])=>{const f=document.createElement('div');f.className='f';f.style.cssText=`width:${a}px;height:${b}px;left:${-a/2}px;top:${-b/2}px;background:${col};transform:${t};filter:brightness(${br})`;c.appendChild(f)});
 if(face)c.firstChild.innerHTML='<i style="left:15px;top:26px;width:13px;height:17px"></i><i style="left:56px;top:26px;width:13px;height:17px"></i><i style="left:20px;top:59px;width:44px;height:7px"></i>';return c}
function buildAvatar(){const a=$('#av3');a.append(mkCube(126,84,63,'#3d7fe0',45),mkCube(84,84,84,'#f5cd30',-45,true))}
const sc=$('#scene'),cb=$('#av3');let dr=null,ry=-20,rx=-6;
sc.onpointerdown=e=>{dr=[e.clientX,e.clientY];sc.setPointerCapture(e.pointerId);cb.style.animation='none';cb.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`};
sc.onpointermove=e=>{if(!dr)return;ry+=(e.clientX-dr[0])*.8;rx=Math.max(-40,Math.min(40,rx-(e.clientY-dr[1])*.5));dr=[e.clientX,e.clientY];cb.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`};
sc.onpointerup=()=>{dr=null};
setMode('up');
const s=L.get('ph_cur');if(s&&accts()[s]){login(s)}else{if(Object.keys(accts()).length)setMode('in');show('auth')}
</script></body></html>
