<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameExpVault</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#10151c;--panel:#1b2430;--panel2:#243142;--line:#33445a;--text:#e8edf3;--dim:#8fa0b4;--brass:#d9a73f;--brass2:#f2cf7a;--teal:#3fd0c0;--bad:#ff7a6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.45 Rubik,system-ui,sans-serif}
h1,h2,h3,.disp{font-family:"Chakra Petch",Rubik,sans-serif;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.hidden{display:none!important}
.btn{background:var(--brass);color:#1a1405;border:0;border-radius:10px;padding:12px 18px;font-weight:500;min-height:44px}
.btn:hover{background:var(--brass2)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2)}
/* AUTH */
#auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;gap:18px}
.dial{width:132px;height:132px}
.dial .ring{transform-origin:60px 60px;transition:transform 1s cubic-bezier(.6,0,.2,1)}
.dial.spin .ring{transform:rotate(540deg)}
.brand{font-size:34px;font-weight:700;letter-spacing:.5px;text-align:center}
.brand span{color:var(--brass)}
.sub{color:var(--dim);margin:0 0 4px;text-align:center}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{background:none;border:0;border-radius:8px;padding:10px;color:var(--dim)}
.seg button[aria-selected=true]{background:var(--panel2);color:var(--text)}
label{display:block;font-size:14px;color:var(--dim);margin:12px 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:46px}
input:focus{border-color:var(--teal);outline:none}
.err{color:var(--bad);min-height:20px;font-size:14px;margin:10px 0 0}
.card .btn{width:100%;margin-top:6px}
.note{font-size:12px;color:var(--dim);max-width:380px;text-align:center}
/* HUB */
#hub{min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:18px;margin-right:auto}
.logo svg{width:32px;height:32px}
.logo b{color:var(--brass);font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;padding:0}
.ib:hover{border-color:var(--brass)}
.av{background:var(--brass);color:#1a1405;font-weight:700;font-family:"Chakra Petch",sans-serif}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;color:var(--dim);padding:10px 16px;border-radius:999px;white-space:nowrap;min-height:44px}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--brass2);box-shadow:inset 0 -2px 0 var(--brass)}
main{padding:20px 16px 48px;max-width:900px;margin:0 auto}
main h2{font-size:26px;margin-bottom:16px}
main h3{font-size:19px;margin:30px 0 12px;display:flex;align-items:center;justify-content:space-between}
.link{background:none;border:0;color:var(--teal);padding:8px 0}
.friends{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.fr{flex:0 0 76px;text-align:center;background:none;border:0;padding:0;font-size:13px;color:var(--text)}
.fr .c{width:72px;height:72px;margin:0 auto 6px;border-radius:50%;background:var(--panel2);border:1px dashed var(--line);display:grid;place-items:center;font-size:30px;color:var(--brass);position:relative}
.fr .c.u{border:2px solid var(--teal);color:var(--text);font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:24px}
.fr small{display:block;color:var(--dim);font-size:11px}
.badge{position:absolute;top:-2px;right:-2px;background:var(--bad);color:#fff;font-size:11px;border-radius:999px;min-width:20px;height:20px;line-height:20px;font-family:Rubik}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.slot{background:none;border:0;padding:0;text-align:left;color:var(--text)}
.slot .t{aspect-ratio:16/10;border-radius:12px;border:2px dashed var(--line);background:repeating-linear-gradient(135deg,var(--panel) 0 10px,#1e2938 10px 20px);display:grid;place-items:center;color:var(--dim);font-size:28px;transition:border-color .15s,transform .15s}
.slot:hover .t{border-color:var(--brass);transform:translateY(-2px)}
.slot b{display:block;margin-top:8px;font-weight:500}
.slot span{font-size:13px;color:var(--dim)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--dim)}
.empty .btn{margin-top:12px}
/* modal + toast + door */
.modal{position:fixed;inset:0;background:rgba(5,8,12,.7);z-index:20;display:grid;place-items:end center;padding:0}
@media(min-width:640px){.modal{place-items:center;padding:20px}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:420px;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;display:block}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1;margin:0}
.flist{list-style:none;padding:0;margin:12px 0 0}
.flist li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--brass);padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#door{position:fixed;inset:0;z-index:30;display:flex;pointer-events:none}
#door i{flex:1;background:linear-gradient(90deg,#222d3b,#2e3c4f);border:0 solid var(--brass);transition:transform .9s cubic-bezier(.7,0,.2,1)}
#door i:first-child{border-right-width:3px}#door i:last-child{border-left-width:3px}
#door.open i:first-child{transform:translateX(-101%)}#door.open i:last-child{transform:translateX(101%)}
.stage{display:flex;align-items:center;gap:16px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 18px;text-align:left;color:var(--text);margin-bottom:6px}
.stage:hover{border-color:var(--brass)}
.stage .pl{width:80px;height:134px;flex:none;background:radial-gradient(ellipse at 50% 92%,#34465e,transparent 70%)}
.stage .pl svg,#avPrev svg{width:100%;height:100%}
.stage b{display:block;font-family:"Chakra Petch",sans-serif;font-size:18px}
.stage span{color:var(--dim);font-size:14px}
#avPrev{width:120px;height:200px;margin:0 auto 4px;background:radial-gradient(ellipse at 50% 92%,#34465e,transparent 70%)}
.ib.av{background:var(--panel2);overflow:hidden;padding:0}.ib.av svg{width:38px;height:38px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);padding:0;margin:0 6px 6px 0}
.sw.on{border-color:var(--brass2);box-shadow:0 0 0 2px var(--brass)}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;margin:0 6px 6px 0;min-height:40px}
.chip.on{border-color:var(--brass);color:var(--brass2)}
.lb{font-size:14px;color:var(--dim);margin:12px 0 6px}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.sheet{max-height:88vh;overflow:auto}
#dw{position:fixed;inset:0;z-index:25;background:rgba(5,8,12,.6)}
#dw aside{width:min(300px,84vw);height:100%;background:var(--panel);border-right:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;overflow:auto}
.dh{display:flex;align-items:center;gap:12px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dh svg{width:48px;height:48px;background:var(--panel2);border-radius:50%}
.dh b{font-family:"Chakra Petch",sans-serif;font-size:18px}
#dw button.mi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;min-height:48px;color:var(--text)}
#dw button.mi:hover{background:var(--panel2)}
#dw button.mi small{display:block;color:var(--dim);font-size:12px}
.faceBtn{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#34465e,var(--panel2));border:2px solid var(--brass);padding:8px;display:block;margin:0 0 6px}
.faceBtn svg{width:100%;height:100%}.faceBtn:hover{border-color:var(--brass2)}
.ep{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-family:"Chakra Petch",sans-serif;font-weight:700;color:var(--brass2)}
.ep svg{width:26px;height:26px}.ep:hover{border-color:var(--brass)}
#av3{width:170px;height:230px;margin:0 auto;touch-action:none;cursor:grab}
@media(max-width:480px){.logo span{display:none}.top{gap:8px;padding:10px}}
.faceBtn img,.ib.av img,.dh img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.dh img{width:48px;height:48px}
.slot .t.gt{border:2px solid var(--line);background:#8fd3f4;overflow:hidden;padding:0}
.gt svg,.gart svg{width:100%;height:100%;display:block}
.gart{aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.gstats{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:14px;margin-top:10px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px}
.act svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.act[aria-pressed=true]{border-color:var(--brass);color:var(--brass2)}.act[aria-pressed=true] svg{fill:currentColor}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="door" class="hidden" aria-hidden="true"><i></i><i></i></div>

<section id="auth" class="hidden">
  <svg class="dial" id="dial" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="56" fill="#1b2430" stroke="#d9a73f" stroke-width="4"/>
    <g class="ring" stroke="#d9a73f" stroke-width="3" stroke-linecap="round">
      <circle cx="60" cy="60" r="42" fill="none" stroke="#33445a" stroke-width="6"/>
      <path d="M60 14v10M60 96v10M14 60h10M96 60h10M27 27l7 7M86 86l7 7M93 27l-7 7M34 86l-7 7"/>
    </g>
    <circle cx="60" cy="60" r="22" fill="#243142" stroke="#3fd0c0" stroke-width="3"/>
    <path d="M60 46l5 14h-10z" fill="#d9a73f"/><circle cx="60" cy="64" r="4" fill="#d9a73f"/>
  </svg>
  <h1 class="brand">Game<span>Exp</span>Vault</h1>
  <p class="sub">Log in to open your vault.</p>
  <div class="card">
    <div class="seg" role="tablist">
      <button role="tab" id="tLogin" aria-selected="true">Log in</button>
      <button role="tab" id="tSign" aria-selected="false">Sign up</button>
    </div>
    <form id="authForm" autocomplete="on">
      <label for="u">Username</label>
      <input id="u" autocomplete="username" maxlength="20" required>
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" required>
      <div id="cWrap" class="hidden">
        <label for="c">Confirm password</label>
        <input id="c" type="password" autocomplete="new-password">
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="go" type="submit">Log in</button>
    </form>
  </div>
  <p class="note">Accounts are saved only in this browser for now. A real online account system comes later.</p>
</section>

<section id="hub" class="hidden">
  <header class="top">
    <button class="ib" id="bMenu" aria-label="Menu">&#9776;</button>
    <div class="logo">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="#243142" stroke="#d9a73f" stroke-width="8"/><circle cx="60" cy="60" r="26" fill="none" stroke="#3fd0c0" stroke-width="8"/><circle cx="60" cy="60" r="8" fill="#d9a73f"/></svg>
      <span>Game<b>Exp</b>Vault</span>
    </div>
    <button class="ib" id="bSearch" aria-label="Search">&#128269;</button>
    <button class="ep" id="bCred" aria-label="Your EP balance"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="epg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8e"/><stop offset="1" stop-color="#b9831f"/></linearGradient></defs><polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="url(#epg)" stroke="#7a5510" stroke-width="1.5"/><polygon points="16,6 24.5,11 24.5,21 16,26 7.5,21 7.5,11" fill="#1b2430" stroke="#3fd0c0" stroke-width="1.2"/><path d="M17.5 9.5L12 17h3.6l-1.1 5.5L20 15h-3.6z" fill="#3fd0c0"/></svg><span id="epN">0</span></button>
    <button class="ib" id="bSet" aria-label="Settings">&#9881;</button>
    <button class="ib av" id="bAv" aria-label="Your profile"></button>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="home" aria-selected="true">Vault</button>
    <button role="tab" data-t="charts" aria-selected="false">Charts</button>
    <button role="tab" data-t="market" aria-selected="false">Marketplace</button>
    <button role="tab" data-t="create" aria-selected="false">Create</button>
  </nav>
  <main id="main"></main>
</section>

<div id="dw" class="hidden"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var mem={};
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return mem[k]||null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}mem[k]=v}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hash(s){
  try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode('gev:'+s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
  catch(e){var h=5381;for(var i=0;i<s.length;i++)h=(h*33)^s.charCodeAt(i);return Promise.resolve('x'+(h>>>0))}
}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2200)}

var mode='login',user=null,tab='home';

/* AUTH */
function setMode(m){
  mode=m;$('#err').textContent='';
  $('#tLogin').setAttribute('aria-selected',m==='login');
  $('#tSign').setAttribute('aria-selected',m==='signup');
  $('#cWrap').classList.toggle('hidden',m==='login');
  $('#go').textContent=m==='login'?'Log in':'Create account';
  $('#p').autocomplete=m==='login'?'current-password':'new-password';
  $('.sub').textContent=m==='login'?'Log in to open your vault.':'Create an account to get your own vault.';
}
$('#tLogin').onclick=function(){setMode('login')};
$('#tSign').onclick=function(){setMode('signup')};
$('#authForm').onsubmit=function(e){
  e.preventDefault();
  var name=$('#u').value.trim(),pw=$('#p').value,err=$('#err');
  err.textContent='';
  if(!/^[A-Za-z0-9_]{3,20}$/.test(name)){err.textContent='Username must be 3–20 letters, numbers or underscores.';return}
  if(pw.length<6){err.textContent='Password must be at least 6 characters.';return}
  var users=load('gev_users')||{},key=name.toLowerCase();
  if(mode==='signup'){
    if(pw!==$('#c').value){err.textContent='Passwords don’t match.';return}
    if(users[key]){err.textContent='That username is taken. Pick another or log in.';return}
    hash(key+pw).then(function(h){users[key]={name:name,h:h};save('gev_users',users);enter(name,true)});
  }else{
    if(!users[key]){err.textContent='No account with that username. Sign up first.';return}
    hash(key+pw).then(function(h){
      if(users[key].h!==h){err.textContent='Wrong password. Try again.';return}
      enter(users[key].name,true);
    });
  }
};
function enter(name,animate){
  user=name;save('gev_session',name);
  if(animate){
    $('#dial').classList.add('spin');
    setTimeout(function(){showHub(true)},900);
  }else showHub(false);
}
function showHub(anim){
  var door=$('#door');
  function swap(){
    $('#auth').classList.add('hidden');$('#hub').classList.remove('hidden');
    updateAv();
    tab='home';syncTabs();render();window.scrollTo(0,0);
  }
  if(!anim){swap();return}
  door.classList.remove('hidden','open');
  void door.offsetWidth;swap();
  door.classList.add('open');
  setTimeout(function(){door.classList.add('hidden')},1000);
}
function logout(){
  save('gev_session',null);user=null;closeModal();
  $('#hub').classList.add('hidden');$('#auth').classList.remove('hidden');
  $('#dial').classList.remove('spin');$('#authForm').reset();setMode('login');
}

/* HUB */
function friends(){return load('gev_friends_'+user.toLowerCase())||[]}
function syncTabs(){document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===tab)})}
function slots(n,label,list){
  var h='<div class="grid">';
  (list||[]).forEach(function(g){h+=gameCard(g)});
  n-=(list||[]).length;
  for(var i=0;i<n;i++)h+='<button class="slot" data-slot="1"><div class="t">+</div><b>Empty slot</b><span>'+label+'</span></button>';
  return h+'</div>';
}
function render(){
  var m=$('#main'),f=friends(),h='';
  if(tab==='home'){
    h+='<h2>Welcome, '+esc(user)+'</h2>';
    h+='<button class="faceBtn" id="avBtn" aria-label="Customize your avatar">'+face(getAv())+'</button>';
    h+='<h3>Friends ('+f.length+') <button class="link" id="seeAll">See all</button></h3><div class="friends">';
    h+='<button class="fr" id="addF"><div class="c">+<span class="badge">0</span></div>Add friends</button>';
    f.slice(0,8).forEach(function(n){h+='<button class="fr" data-f="'+esc(n)+'"><div class="c u">'+esc(n.charAt(0).toUpperCase())+'</div>'+esc(n)+'<small>Offline</small></button>'});
    h+='</div>';
    h+='<h3>Recommended for you</h3>'+slots(4,'Games coming soon',GAMES);
    var fv=GAMES.filter(function(g){return gst(g).fav}),lp=GAMES.filter(function(g){return load(fk('last'))===g.id});
    h+='<h3>Continue</h3>'+(lp.length?slots(0,'',lp):'<div class="empty">Games you play will show up here.</div>');
    h+='<h3>Favorites</h3>'+(fv.length?slots(0,'',fv):'<div class="empty">Tap Favorite on a game to keep it here.</div>');
  }else if(tab==='charts'){
    h+='<h2>Charts</h2>'+slots(4,'No games ranked yet',GAMES);
    h+='<h3>Top rated</h3>'+slots(4,'No games ranked yet');
  }else if(tab==='market'){
    h+='<h2>Marketplace</h2><div class="empty">No items for sale yet.<br><button class="btn" id="notify">Notify me when it opens</button></div>';
  }else{
    h+='<h2>Create</h2><div class="empty">Build your own game for the vault.<br><button class="btn" id="newG">Start a new game</button></div>';
    h+='<h3>Your games</h3>'+slots(2,'Nothing created yet');
  }
  m.innerHTML=h;
}
$('#tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;tab=b.dataset.t;syncTabs();render()};
$('#main').onclick=function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.game)gamePanel(t.dataset.game);
  else if(t.id==='avBtn')avatarEditor();
  else if(t.id==='addF'||t.id==='seeAll')friendsPanel('friends');
  else if(t.dataset.slot)toast('This slot is empty. Games are coming soon.');
  else if(t.dataset.f)toast(t.dataset.f+' is offline.');
  else if(t.id==='notify')toast('Got it. We’ll tell you when it opens.');
  else if(t.id==='newG')toast('Game creator is coming soon.');
};

function start3D(box,c){
  if(!window.THREE){box.innerHTML='<div class="empty">3D preview couldn\u2019t load. Check your connection.</div>';return null}
  try{
    var T=THREE,W=170,H=230,r=new T.WebGLRenderer({alpha:true,antialias:true});
    r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));r.setSize(W,H);box.appendChild(r.domElement);
    var s=new T.Scene(),cam=new T.PerspectiveCamera(38,W/H,.1,50);cam.position.set(0,3,11.5);cam.lookAt(0,2.7,0);
    s.add(new T.AmbientLight(0xffffff,.75));var dl=new T.DirectionalLight(0xffffff,.7);dl.position.set(3,6,8);s.add(dl);
    var m=mk3(c,T),ry=.5,drag=false,lx=0,dead=false,raf,still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    s.add(m);
    box.onpointerdown=function(e){drag=true;lx=e.clientX;box.setPointerCapture&&box.setPointerCapture(e.pointerId)};
    box.onpointermove=function(e){if(drag){ry+=(e.clientX-lx)*.01;lx=e.clientX}};
    box.onpointerup=box.onpointercancel=function(){drag=false};
    (function loop(){if(dead)return;if(!drag&&!still)ry+=.01;m.rotation.y=ry;r.render(s,cam);raf=requestAnimationFrame(loop)})();
    return{
      update:function(nc){s.remove(m);m=mk3(nc,T);s.add(m)},
      dispose:function(){dead=true;cancelAnimationFrame(raf);r.dispose();if(r.domElement.parentNode)r.domElement.parentNode.removeChild(r.domElement);box.onpointerdown=box.onpointermove=box.onpointerup=box.onpointercancel=null}
    };
  }catch(err){box.innerHTML='<div class="empty">3D isn\u2019t supported on this device.</div>';return null}
}

  openModal('<h3>Groups</h3>'+(g.length?'<ul class="flist">'+g.map(function(x){return '<li><span>'+esc(x.name)+'</span><span style="color:var(--dim)">Code '+x.code+'</span></li>'}).join('')+'</ul>':'<div class="empty">You aren’t in any groups yet.</div>')+'<label for="gn">Create a group</label><input id="gn" maxlength="24" placeholder="Group name"><button class="btn" id="gmk" style="margin-top:8px">Create group</button><label for="gj">Join with a code</label><input id="gj" maxlength="8" placeholder="Group code"><button class="btn ghost" id="gjn" style="margin-top:8px;width:100%">Join group</button><p class="err" id="gerr"></p><div class="row"><button class="btn ghost" data-x>Close</button></div>');
  $('#sheet').onclick=function(e){
    var er=$('#gerr');
    if(e.target.id==='gmk'){
      var n=$('#gn').value.trim();
      if(n.length<3){er.textContent='Group name must be at least 3 characters.';return}
      g.push({name:n,code:Math.random().toString(36).slice(2,7).toUpperCase()});save(fk('groups'),g);toast('Group created');groupsPanel();
    }
    if(e.target.id==='gjn'){
      var c=$('#gj').value.trim().toUpperCase();
      if(!c){er.textContent='Enter a group code.';return}
      er.textContent=g.some(function(x){return x.code===c})?'You’re already in that group.':'No group found with that code. Groups are saved only on this device for now.';
    }
  };
}
/* BOOT */
var s=load('gev_session'),users=load('gev_users')||{};
if(s&&users[String(s).toLowerCase()]){user=users[String(s).toLowerCase()].name;showHub(false)}
else{$('#auth').classList.remove('hidden')}
})();
</script>
