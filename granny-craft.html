/* custom items: id = 'u' + slot letter + 12 chars per part (shape, anchor, w,h,d,x,y,z, rgb nibbles, glow) */
function cosDec(id){
  var m=/^u([rhmbno])([A-Za-z0-9_-]{12,120})$/.exec(String(id||''));
  if(!m||m[2].length%12)return null;
  var slot={r:'hair',h:'hat',m:'mask',b:'back',n:'neck',o:'body'}[m[1]],s=m[2],parts=[];
  for(var i=0;i<s.length;i+=12){
    var sh=s.charAt(i),an=s.charAt(i+1);
    if('bok'.indexOf(sh)<0||'ht'.indexOf(an)<0)return null;
    var v=[];for(var j=0;j<6;j++)v.push(B64.indexOf(s.charAt(i+2+j)));
    var col='#';for(var k=0;k<3;k++){var n=parseInt(s.charAt(i+8+k),16);if(isNaN(n))return null;col+=('0'+(n*17).toString(16)).slice(-2)}
    parts.push([an,sh,Math.max(.05,v[0]/20),Math.max(.05,v[1]/20),Math.max(.05,v[2]/20),(v[3]-32)/16,(v[4]-32)/16,(v[5]-32)/16,col,s.charAt(i+11)==='1'?1:0]);
  }

}
function cosEnc(slot,ps){

  function q(v,k,o){return B64.charAt(Math.max(0,Math.min(63,Math.round(v*k)+(o||0))))}

/* clothing designs: id = 'v' + type (s shirt / p pants) + palette size (hex) + 3 hex chars per colour + 171 chars of 4-bit pixels (16 x 16) */
function clothDec(id){
  id=String(id||'');
  if(id.length<175||id.charAt(0)!=='v')return null;
  var t=id.charAt(1);if(t!=='s'&&t!=='p')return null;
  var n=parseInt(id.charAt(2),16);if(!(n>=1&&n<=15)||id.length!==3+n*3+171)return null;
  var pal=[null];
  for(var i=0;i<n;i++){var c='#';for(var k=0;k<3;k++){var h=parseInt(id.charAt(3+i*3+k),16);if(isNaN(h))return null;c+=('0'+(h*17).toString(16)).slice(-2)}pal.push(c)}
  var data=id.slice(3+n*3),bits=[];
  for(var j=0;j<171;j++){var v=B64.indexOf(data.charAt(j));if(v<0)return null;for(var b=5;b>=0;b--)bits.push((v>>b)&1)}

}
function clothEnc(type,grid){
  function nib(c){var m=/^#([0-9a-f])([0-9a-f])([0-9a-f])/i.exec(c);if(!m)return null;return [1,3,5].map(function(i){return Math.round(parseInt(c.substr(i,2),16)/17).toString(16)}).join('')}
  function dist(a,b){var s=0;for(var i=0;i<3;i++){var d=parseInt(a.charAt(i),16)-parseInt(b.charAt(i),16);s+=d*d}return s}
  var pal=[],px=grid.map(function(c){
    var k=c?nib(c):null;if(!k)return 0;
    var i=pal.indexOf(k);
    if(i<0){if(pal.length<15){pal.push(k);i=pal.length-1}else{var best=0,bd=1e9;pal.forEach(function(p,j){var d=dist(p,k);if(d<bd){bd=d;best=j}});i=best}}
    return i+1;
  });
  if(!pal.length)return '';
  var bits=[];px.forEach(function(v){for(var b=3;b>=0;b--)bits.push((v>>b)&1)});
  while(bits.length%6)bits.push(0);
  var out='';for(var i=0;i<bits.length;i+=6){var v=0;for(var k=0;k<6;k++)v=v*2+bits[i+k];out+=B64.charAt(v)}
  return 'v'+type+pal.length.toString(16)+pal.join('')+out;
}

/* ===== GEVS: friends, chat and presence over WebRTC (PeerJS). Same code in the hub and the game. ===== */
function makeGEVS(){
  var P=null,user='',h={},st={},timer=null,mem={},stopped=true;
  function rd(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]!==undefined?mem[k]:d}}
  function wr(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function K(n){return 'gev_'+n+'_'+user.toLowerCase()}
  function CK(f){return 'gev_chat_'+String(f).toLowerCase()+'_'+user.toLowerCase()}
  function pid(n){return 'gevhub-'+String(n).toLowerCase()}
  function ok(n){return /^[A-Za-z0-9_]{3,20}$/.test(n||'')}
  function has(a,n){return a.some(function(x){return x.toLowerCase()===String(n).toLowerCase()})}
  function not(a,n){return a.filter(function(x){return x.toLowerCase()!==String(n).toLowerCase()})}
  function friends(){return rd(K('friends'),[])}
  function sent(){return rd(K('sent'),[])}
  function inc(){return rd(K('req'),[])}
  function chg(){if(h.changed)h.changed()}
  function say(m){if(h.notify)h.notify(m)}
  function addFriend(n){var f=friends();if(!has(f,n)){f.push(n);wr(K('friends'),f)}wr(K('sent'),not(sent(),n));wr(K('req'),not(inc(),n))}
  function send(to,msg,cb){
    var p=P;if(!p||!p.open||!ok(to)){if(cb)cb(null);return}
    var done=false,c=null,t;
    function fin(r){if(done)return;done=true;clearTimeout(t);try{if(c)c.close()}catch(e){}if(cb)cb(r)}
    t=setTimeout(function(){fin(null)},5000);
    try{c=p.connect(pid(to),{reliable:true})}catch(e){fin(null);return}
    c.on('open',function(){c.send(msg)});
    c.on('data',function(d){fin(d)});
    c.on('error',function(){fin(null)});
  }
  function addMsg(f,m){var a=rd(CK(f),[]);a.push(m);if(a.length>80)a=a.slice(-80);wr(CK(f),a)}

    send(to,{t:'chat',from:user,id:id,text:text},function(r){
      if(r&&r.t==='ack'){var a=rd(CK(to),[]);a.forEach(function(m){if(m.id===id)delete m.q});wr(CK(to),a);chg()}
    });
  }
  function onMsg(c,d){
    if(!d||typeof d!=='object')return;
    if(d.t==='ping'){c.send({t:'pong',g:h.game?h.game():null,r:h.room?h.room():null,av:h.av?h.av():null,bio:h.bio?String(h.bio()).slice(0,60):''});return}

    if(d.t==='req'){
      if(has(friends(),f)||has(sent(),f)){addFriend(f);send(f,{t:'acc',from:user});say(f+' is now your friend')}
      else if(!has(inc(),f)){var i=inc();i.push(f);wr(K('req'),i);say(f+' sent you a friend request')}

    }
    if(d.t==='acc'&&has(sent(),f)){addFriend(f);say(f+' accepted your friend request');chg()}
    if(d.t==='rm'&&has(friends(),f)){wr(K('friends'),not(friends(),f));chg()}

      if(!has(friends(),f))return;
      var id=String(d.id||'').slice(0,24),txt=String(d.text||'').slice(0,300);if(!txt||!id)return;

        var u=rd(K('unread'),{});u[f.toLowerCase()]=(u[f.toLowerCase()]||0)+1;wr(K('unread'),u);

  }
  function open(n){
    if(stopped)return;
    var p;try{p=new Peer(pid(user))}catch(e){return}
    P=p;
    p.on('open',function(){if(h.ready)h.ready();poll();retry()});
    p.on('connection',function(c){c.on('data',function(d){try{onMsg(c,d)}catch(e){}})});
    p.on('disconnected',function(){try{p.reconnect()}catch(e){}});
    p.on('error',function(e){
      if(e&&e.type==='unavailable-id'){try{p.destroy()}catch(x){}if(P===p)P=null;if(n<10)setTimeout(function(){open(n+1)},3000);else if(h.taken)h.taken()}

    request:function(n,cb){

      if(has(inc(),n)){addFriend(n);send(n,{t:'acc',from:user});chg();return cb('accepted')}

    decline:function(n){wr(K('req'),not(inc(),n));chg()},
    cancel:function(n){wr(K('sent'),not(sent(),n));chg()},
    remove:function(n){wr(K('friends'),not(friends(),n));send(n,{t:'rm',from:user},null);chg()}
  };
}

  const a=anchorFor(G.x,G.z,G.fl),k=1-Math.exp(-dt*1.6);

  tour.lx+=(G.x-tour.lx)*(1-Math.exp(-dt*3));tour.lz+=(G.z-tour.lz)*(1-Math.exp(-dt*3));tour.ly+=(G.y+1.3-tour.ly)*(1-Math.exp(-dt*3));
  cam.position.set(tour.x,tour.y,tour.z);cam.lookAt(tour.lx,tour.ly,tour.lz);
  /* look slightly toward Granny but keep the avatar in the corner */
  menuLamp.visible=true;flash1.visible=false;
  if(menuAv){menuAv.rotation.y=.55+Math.sin(performance.now()/1400)*.25;}
  renderGranny(dt,GV,true);
  bridge.visible=false;
  itemMesh.forEach((m,i)=>{const it=items[i];m.visible=true;m.position.set(it.x,it.y,it.z);m.rotation.y+=dt*.8;});
  doors.forEach(d=>{const t=d.open?1.45:0;d.ang+=(t-d.ang)*Math.min(1,dt*8);d.pivot.rotation.y=(d.axis==="z"?-1:1)*d.ang*(d.axis==="z"?1:-1);});
}
function renderGranny(dt,src,direct){
  const k=Math.min(1,dt*10);
  const tx=direct?G.x:S.g[0],tz=direct?G.z:S.g[1],ty=direct?G.y:S.g[2],tyaw=direct?G.yaw:S.g[3];
  src.x+=(tx-src.x)*k;src.z+=(tz-src.z)*k;src.y+=(ty-src.y)*k;
  let dy=tyaw-src.yaw;while(dy>Math.PI)dy-=2*Math.PI;while(dy<-Math.PI)dy+=2*Math.PI;src.yaw+=dy*Math.min(1,dt*8);
  granny.position.set(src.x,src.y,src.z);granny.rotation.y=src.yaw+Math.PI;
  const sp=direct?G.sp:(S.g[6]||0),st=direct?G.st:S.g[4],u=granny.userData;
  src.ph=(src.ph||0)+sp*dt*3.2;const sw=sp>0?Math.sin(src.ph)*.6:0;
  u.legL.rotation.x=sw;u.legR.rotation.x=-sw;u.armL.rotation.x=-sw*.7;
  u.armR.rotation.x=st==="chase"?-1.5:sw*.7;u.bat.visible=true;
  const red=st==="chase";u.eyeL.material.color.setHex(red?0xff2020:0x111111);u.eyeR.material.color.setHex(red?0xff2020:0x111111);
  u.glow.intensity=mode==="menu"?.9:0;
}
function srcPlayers(){return isHost?players:Object.fromEntries(Object.keys(S.p).map(id=>{const a=S.p[id];return [id,{x:a[0],z:a[1],y:a[2],yaw:a[3],crouch:a[4],fl:a[5],held:a[6],dead:a[7],spd:a[8]}];}));}
function playTick(dt){
  if(paused){renderWorldState(dt);return;}
  /* --- local movement --- */
  let ix=jx,iz=-jy;
  if(keys.w||keys.arrowup)iz+=1;if(keys.s||keys.arrowdown)iz-=1;if(keys.d)ix+=1;if(keys.a)ix-=1;
  if(keys.arrowleft)me.yaw+=dt*1.8;if(keys.arrowright)me.yaw-=dt*1.8;
  const mag=Math.min(1,Math.hypot(ix,iz));
  if(mag>.05&&!ended){
    const fx=-Math.sin(me.yaw),fz=-Math.cos(me.yaw),rx=Math.cos(me.yaw),rz=-Math.sin(me.yaw);
    const nx=(fx*iz+rx*ix),nz=(fz*iz+rz*ix),nl=Math.hypot(nx,nz)||1;
    const sprint=mag>.85&&!me.crouch;
    const speed=me.crouch?1.5:(sprint?4.7:2.9);
    const ox=me.x,oz=me.z;
    moveEntity(me,nx/nl*speed*mag*dt,nz/nl*speed*mag*dt,.34);
    me.spd=Math.hypot(me.x-ox,me.z-oz)/dt;bobT+=dt*(sprint?10:6);
  }else me.spd*=.8;
  /* --- host simulation --- */
  if(isHost){
    if(!ended){
      grannyTick(dt);
      lastNoiseT-=dt;
      if(lastNoiseT<=0){
        lastNoiseT=.5;
        for(const id in players){const p=players[id];if(p.dead||p.crouch)continue;if(p.spd>4)noise(p.x,p.z,p.fl,10);else if(p.spd>1.2)noise(p.x,p.z,p.fl,3.4);}
      }
      for(const id in players){
        const p=players[id];
        if(p.pfl===2&&p.fl===1&&!inRamp(p.x,p.z)&&p.y<.5){noise(p.x,p.z,1,18);sfx(60,.4,.3);if(id==="h"){flash("hit");showBanner("You fell through the broken floor!");}else sendTo(id,{t:"ev",m:"You fell through the broken floor!"});}
        p.pfl=p.fl;
        if(dFront.open&&!dFront.lock&&p.z<-.7&&p.fl===1&&!ended){ended="win";ev((p.n||"Someone")+" escaped from Granny's house!");}
      }
    }
    snapT-=dt;if(snapT<=0){snapT=.09;if(conns.length)sendAll(snapshot());}
  }else{
    inT-=dt;
    if(inT<=0&&hostConn&&hostConn.open){inT=.066;hostConn.send({t:"in",x:r2(me.x),z:r2(me.z),y:r2(me.y),fl:me.fl,yaw:r2(me.yaw),c:me.crouch?1:0});}
    if(me.fl===2&&fallPrev!==me.fl&&!inRamp(me.x,me.z)){flash("hit");showBanner("You fell through the broken floor!");}
    fallPrev=me.fl;
  }
  if(ended){showEnd();}
  /* --- camera --- */
  const eye=me.crouch?1.05:1.62,bobY=mag>.05?Math.sin(bobT)*.035:0;
  cam.position.set(me.x,me.y+eye+bobY,me.z);cam.rotation.set(me.pitch,me.yaw,0);
  flash1.visible=flashOn;menuLamp.visible=false;
  renderWorldState(dt);updateHud();
}
function renderWorldState(dt){
  const sp=srcPlayers();
  /* items */
  itemMesh.forEach((m,i)=>{
    const it=items[i],holder=it.held;
    if(it.used||holder===myId){m.visible=false;return;}
    m.visible=true;
    if(holder!==null){const hp=sp[holder];if(hp){m.position.set(hp.x,hp.y+1.9,hp.z);}else m.visible=false;}
    else m.position.set(it.x,it.y,it.z);
    m.rotation.y+=dt*.8;
  });
  for(const k in hand)hand[k].visible=(me.held===k)&&mode==="play";
  bridge.visible=ladderPlaced;
  doors.forEach(d=>{
    const t=d.open?1.45:0;d.ang+=(t-d.ang)*Math.min(1,dt*9);d.pivot.rotation.y=(d.axis==="z"?-1:1)*d.ang*(d.axis==="z"?1:-1);
    if(d.pivot.children[1])d.pivot.children[1].visible=!!d.lock;
  });
  /* granny */
  if(isHost)renderGranny(dt,GV,true);else if(S.g)renderGranny(dt,GV,false);
  /* other players */
  const seen={};
  for(const id in sp){
    if(id===myId)continue;seen[id]=1;
    const p=sp[id],g=ensureOther(id),v=(V[id]=V[id]||{x:p.x,z:p.z,y:p.y,yaw:p.yaw,ph:0}),k=Math.min(1,dt*10);
    v.x+=(p.x-v.x)*k;v.z+=(p.z-v.z)*k;v.y+=(p.y-v.y)*k;let dy=p.yaw-v.yaw;while(dy>Math.PI)dy-=2*Math.PI;while(dy<-Math.PI)dy+=2*Math.PI;v.yaw+=dy*Math.min(1,dt*10);
    g.position.set(v.x,v.y,v.z);g.rotation.y=v.yaw+Math.PI;
    v.ph+=(p.spd||0)*dt*2.4;const sw=(p.spd||0)>.3?Math.sin(v.ph)*.7:0,u=g.userData;
    u.legL.rotation.x=sw;u.legR.rotation.x=-sw;u.armL.rotation.x=-sw;u.armR.rotation.x=sw;
    g.scale.y=p.crouch?.4:.5;
    if(roster[id]&&u.tagName!==roster[id][0]){u.tagName=roster[id][0];}
  }
  for(const id in others)if(!seen[id]){scene.remove(others[id]);delete others[id];}
}
function updateHud(){
  const ob=isHost?objective():S.obj;
  $("day").textContent="Day "+Math.min(day,DAYS_MAX)+" / "+DAYS_MAX;
  $("obj").textContent=OBJ[ob]||"";
  const t=interactFor(me);
  $("prompt").textContent=t?t.text:"";$("bUse").classList.toggle("ready",!!t);
  const st=isHost?G.st:(S.g?S.g[4]:"wander");
  const warn=$("warn");
  if(st==="chase"){warn.textContent="GRANNY SEES YOU! RUN!";warn.className="chase";}
  else if(st==="invest"){warn.textContent="Granny heard something...";warn.className="invest";}
  else warn.className="";
  const held=me.held;$("hold").textContent=held?("Carrying: "+(itemByKey(held)?itemByKey(held).n:"item")):"";
  $("vig").style.opacity=st==="chase"?.55:(st==="invest"?.2:0);
  $("hud").classList.toggle("tr",false);
}
function showEnd(){
  if(!$("end").classList.contains("hide"))return;
  const win=ended==="win";
  $("endT").textContent=win?"YOU ESCAPED!":"GAME OVER";
  $("endS").textContent=win?"You got out of Granny's house on day "+Math.min(day,DAYS_MAX)+".":"Granny caught you five times.";
  $("end").classList.remove("hide");
  if(win&&HUBUSER){try{const k="gev_save_granny_"+HUBUSER.toLowerCase(),o=JSON.parse(localStorage.getItem(k)||"{}");o.w=(o.w||0)+1;o.b=o.b?Math.min(o.b,day):day;localStorage.setItem(k,JSON.stringify(o));}catch(e){}}
}
/* ======================= MENU + START ======================= */
function startPlay(fresh){
  mode="play";me.dead=0;me.crouch=false;$("bCr").classList.remove("on");
  $("menu").classList.add("hide");$("hud").classList.remove("hide");setMenuAvatar(false);
  if(fresh){newRun();me.x=SPAWN.x;me.z=SPAWN.z;me.fl=2;me.y=F2;me.yaw=-Math.PI/2*0+Math.PI;me.pitch=0;}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  showBanner("Find the keys. Escape before day 5.");
}
function showPanel(id){["s_main","s_mp"].forEach(k=>$(k).classList.toggle("hide",k!==id));if(id==="s_mp"){GEVS.poll();renderFriends();}}
function stats(){try{const o=JSON.parse(localStorage.getItem("gev_save_granny_"+HUBUSER.toLowerCase())||"{}");return o.w?("Escapes: "+o.w+" (best: day "+o.b+")"):"";}catch(e){return "";}}
function miniFace2(str){
  const A=parseAv(str||""),h=c=>"#"+("000000"+c.toString(16)).slice(-6);
  let t='<svg viewBox="28 -4 44 46"><rect x="34" y="6" width="32" height="32" rx="7" fill="'+h(A.skin)+'"/><circle cx="43.5" cy="20" r="2.4" fill="#222"/><circle cx="56.5" cy="20" r="2.4" fill="#222"/><path d="M43 28q7 6 14 0" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>';
  if(A.hair!=="none")t+='<rect x="32" y="1" width="36" height="11" rx="4" fill="'+h(A.hairc)+'"/>';
  return t+"</svg>";
}
function showNotif(from,text){
  const box=$("fnot");const d=document.createElement("div");d.className="fn";
  d.innerHTML='<div class="av">'+miniFace2(GEVS.favs()[from.toLowerCase()])+'</div><div><b>'+esc(from)+'</b><span>'+esc(text)+'</span></div>';
  box.appendChild(d);while(box.children.length>3)box.removeChild(box.firstChild);setTimeout(()=>d.remove(),6500);
}
function renderFriends(){
  const b=$("frl");if(!b)return;const f=GEVS.friends();
  if(!f.length){b.innerHTML='<p class="dim">No friends yet. Add friends in GameExpVault.</p>';return;}
  b.innerHTML=f.map(n=>{
    const q=GEVS.status(n),t=!q?"Checking...":!q.on?"Offline":q.g==="granny"?(q.r?"In a house":"In Granny Craft"):q.g?"Playing another game":"Online";
    const j=q&&q.on&&q.g==="granny"&&q.r?'<button class="sq" data-fj="'+esc(q.r)+'">Join</button>':"";
    return '<div class="fr"><span class="avs">'+esc(n.charAt(0).toUpperCase())+'</span><span class="fn2">'+esc(n)+'<small class="'+(q&&q.on?"on":"")+'">&#9679; '+t+'</small></span>'+j+'</div>';
  }).join("");
}
function initMenu(){
  $("logo").innerHTML=LOGO;
  $("stats").textContent=stats();
  $("pSolo").onclick=()=>{isHost=true;players={h:me};roomCode=null;window.GEV_ROOM=null;startPlay(true);};
  $("pFriends").onclick=()=>showPanel("s_mp");
  $("pBack").onclick=()=>{location.href=HUB_URL;};
  $("mCreate").onclick=()=>{if(typeof Peer==="undefined"){toast("Multiplayer needs an internet connection.");return;}hostSetup(String(Math.floor(1000+Math.random()*9000)));startPlay(true);};
  $("mJoin").onclick=()=>joinRoom($("code").value);
  $("mBack").onclick=()=>showPanel("s_main");
  $("frrefresh").onclick=()=>{GEVS.poll();renderFriends();};
  $("frl").addEventListener("click",e=>{const j=e.target.closest("[data-fj]");if(j)joinRoom(j.dataset.fj);});
  $("gatebtn").onclick=()=>{location.href=HUB_URL;};
  $("endBtn").onclick=()=>{location.href=location.pathname;};
}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-frame.last||16)/1000);frame.last=now;
  if(mode==="menu")menuTick(dt);else playTick(dt);
  renderer.render(scene,cam);
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();placeMenuAv();}
addEventListener("resize",resize);
/* boot */
(function(){
  resize();initMenu();
  me.n=HUBUSER?cleanName(HUBUSER):"Guest";me.av=MYAV;
  if(!HUBUSER){$("s_main").classList.add("hide");$("gate").classList.remove("hide");}
  else{
    GEVS.start(HUBUSER,{game:()=>"granny",room:()=>window.GEV_ROOM||null,av:()=>MYAV,notify:toast,chat:showNotif,changed:renderFriends});
    setMenuAvatar(true);grannyReset();renderFriends();
    const q=new URLSearchParams(location.search),rm=q.get("room");
    if(rm&&q.get("join")){$("code").value=rm;setTimeout(()=>joinRoom(rm),600);}
  }
  requestAnimationFrame(frame);
})();
function cleanName(n){return String(n).replace(/[^A-Za-z0-9_ ]/g,"").slice(0,14)||"Player";}
